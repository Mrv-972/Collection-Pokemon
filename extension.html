<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extension — PokéClasseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.tcgdex.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://assets.tcgdex.net">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --paper:#F1EBDC; --paper-line:#D9CFB6;
    --teal:#1F6F63; --teal-deep:#123F38; --rust:#A8431C; --gold:#C9A227; --gold-rgb:201,162,39; --accent-clair:var(--accent-clair);
    --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(237,234,224,0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a.active{color:var(--text-on-ink)}

  .breadcrumb{padding:24px 0 0;font-size:13px;color:var(--text-on-ink-dim);}
  .breadcrumb a:hover{color:var(--text-on-ink)}

  .page-head{padding:18px 0 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .page-head img{height:56px;object-fit:contain;}
  .page-head h1{font-size:30px;}
  .page-head .avertissement{color:var(--accent-clair);opacity:.85;margin-top:3px;}
  .page-head .meta{color:var(--text-on-ink-dim);font-size:14px;margin-top:6px;}

  .toolbar{display:flex;gap:10px;padding-bottom:30px;flex-wrap:wrap;align-items:center;}
  .toolbar input{flex:1;min-width:180px;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:11px 14px;border-radius:4px;font-size:14px;font-family:inherit;}
  .toolbar input::placeholder{color:var(--text-on-ink-dim)}
  .toolbar select{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:10px 14px;border-radius:4px;font-size:13px;font-family:inherit;}
  .filter-btn{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink-dim);padding:10px 16px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;}
  .filter-btn.on.obt{color:var(--accent-clair);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.1)}
  .filter-btn.on.manq{color:#B9C2CE;border-color:rgba(185,194,206,0.45);background:rgba(185,194,206,0.08)}
  .filter-btn.on.rech{color:#E08862;border-color:rgba(168,67,28,0.5);background:rgba(168,67,28,0.1)}
  .filter-btn.on.ech{color:#5FBAAA;border-color:rgba(31,111,99,0.5);background:rgba(31,111,99,0.12)}

  .tri-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:-18px;padding-bottom:14px;font-size:12.5px;color:var(--text-on-ink-dim);}
  .tri-row select{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:6px 10px;border-radius:4px;font-size:12.5px;font-family:inherit;}
  .tri-row button{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:5px 11px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;line-height:1.3;}
  .tri-row button:hover{border-color:rgba(237,234,224,0.35)}
  .tri-row select:disabled, .tri-row button:disabled{opacity:.5;cursor:default}
  .tri-row #tri-etat{color:var(--accent-clair);}
  .card-cote{font-size:11.5px;color:var(--accent-clair);margin-top:-3px;}

  .bulk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-14px;padding-bottom:28px;font-size:12.5px;color:var(--text-on-ink-dim);}
  .bulk-btn{font-size:14px;line-height:1.2;padding:4px 12px;border-radius:3px;cursor:pointer;border:1px solid rgba(237,234,224,0.14);background:transparent;font-family:inherit;transition:.12s;}
  .bulk-btn:hover{border-color:rgba(237,234,224,0.35);background:rgba(237,234,224,0.04)}

  .card-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;padding-bottom:60px;}
  @media(max-width:960px){.card-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:640px){.card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  /* Deux colonnes en dessous de 430 px. À trois, la carte tombe à 83 px
     et ses trois boutons de tag à 24 px de large : marquer une carte,
     qui est le geste principal du site, devient un jeu d'adresse.
     On voit moins de cartes à la fois, mais on les marque juste. */
  @media(max-width:430px){.card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .card-tile{display:flex;flex-direction:column;gap:8px;height:100%;}
  /* flex:none empêche la boîte d'être comprimée par un nom sur trois
     lignes ou par une ligne de cote ; margin-top:auto pousse les tags
     en bas, pour qu'ils s'alignent d'une vignette à l'autre. */
  .card-img-wrap{flex:none;position:relative;aspect-ratio:2.5/3.5;border-radius:6px;overflow:hidden;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);display:flex;align-items:center;justify-content:center;}
  /* La carte est montrée entière, jamais rognée. Les visuels fournis par
     TCGdex n'ont pas tous exactement la même proportion — scans d'anciennes
     séries, promos hors format — et « cover » les agrandissait jusqu'à
     remplir la boîte, si bien qu'une carte sur deux paraissait plus grosse
     que sa voisine. « contain » l'inscrit dans une boîte toujours identique,
     à la plus grande taille qui la laisse entière. */
  .card-img-wrap img{width:100%;height:100%;object-fit:contain;}
  .card-img-wrap .glyph{font-family:'Newsreader',serif;font-style:italic;color:#5A5D63;font-size:44px;line-height:1;}
  .card-num{font-size:11px;color:var(--text-on-ink-dim);display:flex;justify-content:space-between;align-items:center;gap:6px;}
  /* min-width:0 : sans lui, un élément flex refuse de descendre sous la
     largeur de son texte, et les points de suspension ne servent à rien. */
  .card-num span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rarity-symbol{color:var(--gold);letter-spacing:1px;}
  /* Les icônes suivent la taille du texte autour : une carte plus petite sur
     téléphone garde des symboles proportionnés, sans règle supplémentaire. */
  .icone-rarete{height:1.05em;width:auto;vertical-align:-.16em;display:inline-block}
  .icone-rarete + .icone-rarete{margin-left:1px}
  .card-name{font-size:13px;font-weight:500;}

  .tag-row{margin-top:auto;display:flex;gap:5px;}
  /* Les symboles sont des emojis : leur couleur ne se pilote pas en CSS.
     L'état inactif est donc signalé en les désaturant. */
  .tag-toggle{flex:1;font-size:14px;line-height:1.2;padding:5px 0;border-radius:3px;text-align:center;cursor:pointer;border:1px solid rgba(237,234,224,0.14);background:transparent;font-family:inherit;transition:.12s;}
  .tag-toggle:not(.active){filter:grayscale(1);opacity:.45}
  .tag-toggle.obt.active{background:rgba(var(--gold-rgb),0.16);border-color:rgba(var(--gold-rgb),0.5)}
  .tag-toggle.rech.active{background:rgba(168,67,28,0.16);border-color:rgba(168,67,28,0.5)}
  .tag-toggle.ech.active{background:rgba(31,111,99,0.18);border-color:rgba(31,111,99,0.5)}
  .tag-toggle:hover{border-color:rgba(237,234,224,0.35);opacity:1}
  /* Le bouton « échangeable » bloqué vit dans une enveloppe qui reçoit le
     clic à sa place : elle doit donc reprendre la largeur qu'il occupait. */
  .ech-bloque{flex:1;display:flex;cursor:help}
  .ech-bloque .tag-toggle{flex:1;cursor:help}
  .tag-toggle.bloque,.tag-toggle.bloque:hover{opacity:.28;filter:grayscale(1);
    border-style:dashed;border-color:rgba(237,234,224,0.14)}

  .skeleton{aspect-ratio:2.5/3.5;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:6px;position:relative;overflow:hidden;}
  .skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(237,234,224,0.06),transparent);animation:shine 1.4s infinite;}
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .status-msg{color:var(--text-on-ink-dim);font-size:14px;padding:20px 0;}
  .status-msg.err{color:#E08862}
  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(237,234,224,0.08);}

  /* ========================= Téléphone =========================
     Les liens de navigation passaient en display:none sous 720 px : depuis
     un téléphone, on ne pouvait plus aller d'une section à l'autre du tout.
     Ils descendent maintenant sur une deuxième ligne de la barre, toujours
     visibles, et assez hauts pour être touchés sans viser. La règle de
     débordement horizontal n'est là que pour les très petits écrans, où
     quatre libellés ne tiennent plus côte à côte.

     Le reste resserre des marges verticales taillées pour un grand écran,
     et porte les commandes à une hauteur tactile confortable — en bas de
     42 px, un doigt touche la voisine une fois sur trois. */
  @media(max-width:720px){
    nav{flex-wrap:wrap;padding:18px 0 0;}
    .navlinks{display:flex;order:3;width:100%;gap:4px;font-size:12.5px;
              justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
    .navlinks::-webkit-scrollbar{display:none}
    .navlinks a{white-space:nowrap;padding:12px 6px;border-bottom:2px solid transparent;}
    .navlinks a.active{border-bottom-color:currentColor;}
    .brand{font-size:19px;padding:6px 0}
    .compte-lien{padding:11px 0 11px 12px}
    .breadcrumb a{display:inline-block;padding:12px 0}

    .page-head{padding:12px 0 20px;gap:14px}
    .page-head h1{font-size:23px}
    .page-head img{height:44px}
    .filter-btn{min-height:42px}
    #filter-input, .filtres select, select{min-height:42px}
    .tri-row{margin-top:-6px;padding-bottom:12px}
    .tri-row select, .tri-row button{min-height:40px;padding:8px 12px}
    .bulk-row{margin-top:-6px;padding-bottom:22px}
    /* L'intitulé prend toute la ligne, sinon les trois boutons se
       séparent et le dernier tombe seul en dessous. */
    .bulk-row > span:first-child{flex:1 0 100%}
    .bulk-btn{min-height:40px;padding:6px 16px}
    /* Trois colonnes laissent des cartes de 100 px : les tags en dessous
       gagnent en hauteur ce qu'ils ne peuvent pas gagner en largeur. */
    .tag-toggle{padding:11px 0;font-size:16px}
  }
</style>
</head>

<div class="wrap">
  <nav>
    <a class="brand" href="index.html">Poké<span>Classeur</span></a>
    <div class="navlinks">
      <a href="series.html" class="active">Par extension</a>
      <a href="pokemon.html">Par Pokémon</a>
      <a href="missions.html" class="lien-pocket">Missions secrètes</a>
      <a href="echanges.html">Échanges</a>
      <a href="discussions.html">Discussions</a>
    </div>
    <a class="brand compte-lien" style="font-size:14px;font-style:normal" href="connexion.html">Se connecter →</a>

  <div class="breadcrumb"><a href="series.html">← Toutes les séries</a></div>

    <button class="bulk-btn" data-bulk="rech" title="Marquer comme recherchées (recliquer pour tout décocher)">❤️</button>
    <button class="bulk-btn" data-bulk="ech" title="Marquer comme échangeables (recliquer pour tout décocher)">🔁</button>
  </div>

  <div id="content">
    <div class="card-grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <footer data-note="Sans compte, tes marquages restent dans ce navigateur, sur cet appareil."></footer>
</div>

<script>
// Récupère les cartes d'une extension depuis l'API publique et gratuite
// TCGdex (aucune clé requise), à partir de l'id passé dans l'URL (?set=...).
// Les images restent hébergées par TCGdex.
const params = new URLSearchParams(window.location.search);
// L'extension par défaut dépend de l'univers : « 151 » pour le physique,
// « Puissance Génétique » pour Pocket, la toute première de l'application.
const setId = params.get('set') || (estPocket() ? 'A1' : 'sv03.5');

// Un lien partagé désigne une extension, pas un univers. Si celle qu'on
// ouvre n'est pas du côté où l'on se croyait, c'est le lien qui a raison :
// on bascule plutôt que d'afficher une extension Pocket sous les couleurs
// du carton.
if(isPocketSet(setId) !== estPocket()) adopterUnivers(isPocketSet(setId) ? 'pocket' : 'physique');

let allCards = [];
let activeFilter = null; // un des FILTERS, ou null

// Filtres de la barre d'outils. "manq" n'est pas un tag : c'est l'absence
// du tag "obt", donc rien à cocher sur les cartes.
const FILTERS = ['obt', 'manq', 'rech', 'ech'];

async function loadRarities(){
  const byCardId = await probeRarities(`set.id=eq:${setId}`, `pokeclasseur_rar_${setId}`, allCards);
  if(!byCardId) return;
  allCards.forEach(c => { c.rarity = byCardId[c.id]; });
  populateRarityFilter(allCards);
  applyFilters();
}

async function init(){
  document.getElementById('content').innerHTML = `<div class="card-grid">${Array(12).fill('<div class="skeleton"></div>').join('')}</div>`;

  // Avant le premier rendu, pour que les cartes s'affichent d'emblée avec
  // leurs marques.
  loadTags();

  // La collection en ligne arrive ensuite : elle ne doit pas retarder
  // l'affichage des cartes.
  initCompte().then(async () => {
    afficherEtatCompte();
    if(!estConnecte()) return;
    try{
      await fusionnerCollection();
      applyFilters();
    }catch(err){
      console.warn('Collection en ligne indisponible', err);
    }
  });

  // Cache local : ré-ouvrir la même extension est instantané, on revérifie en arrière-plan.
  const cacheKey = `pokeclasseur_ext_${setId}`;
  const cached = sessionStorage.getItem(cacheKey);
  if(cached){
    const data = JSON.parse(cached);
    renderHead(data.set);
    allCards = data.cards;
    populateRarityFilter(allCards);
    applyFilters();
  }

  try{
    const [set, cards] = await Promise.all([
      lireExtension(setId),
      cartesDeLExtension(setId),
    ]);
    cards.sort((a, b) => (a.localId || '').localeCompare(b.localId || '', undefined, { numeric: true }));
    renderHead(set);
    allCards = cards;
    populateRarityFilter(allCards);
    applyFilters();
    sessionStorage.setItem(cacheKey, JSON.stringify({ set, cards: allCards }));
    // Toutes les sources ne livrent pas la rareté avec la carte : quand
    // elle manque, on la sonde après coup, cartes déjà affichées.
    // On ne sonde que si les cartes sont arrivées sans rareté :
      // l'instantané la porte, certaines sources en direct non.
      if(!allCards.some(c => c.rarity)){
      loadRarities().catch(err => console.warn('Impossible de charger les raretés', err));
    }
  }catch(err){
    console.warn("Impossible de charger l'extension", err);
    if(!cached){
      document.getElementById('page-head').innerHTML = '<h1>Extension introuvable</h1>';
      document.getElementById('content').innerHTML = `<p class="status-msg err">Impossible de charger cette extension pour le moment.<br><span style="font-size:12px;opacity:.7">${err.message}</span><br><br><button onclick="init()" class="filter-btn" style="margin-top:8px">Réessayer</button></p>`;
    }
  }
}

function setLogoFallback(img){
  const fallback = img.dataset.fallback;
  if(fallback){
    img.removeAttribute('data-fallback');
    img.src = fallback;
    return;
  }
  img.style.display = 'none';
}

function renderHead(set){
  if(!set) return;
  const year = set.releaseDate ? new Date(set.releaseDate).getFullYear() : '';
  const total = set.cardCount?.official ?? set.cardCount?.total ?? '?';
  const serie = set.serie?.name || set.serieNom || '';
  // Deux réserves possibles sur une extension, qu'on annonce plutôt que de
  // laisser découvrir : des noms reconstitués faute de version française
  // publiée, et des visuels dont le texte imprimé reste en anglais parce
  // qu'aucune source n'héberge la version française.
  const reserves = [];
  if(set.traductionAutomatique){
    const t = set.traductionAutomatique;
    reserves.push(`noms traduits automatiquement (${t.traduits}/${t.total})`);
  }
  if(set.visuelsAnglais) reserves.push('visuels des cartes en anglais');
  document.getElementById('page-head').innerHTML = `
    ${set.logo
      ? `<img src="${set.logo}.png" alt="${set.name}" data-fallback="images/sets/${setId}.png" onerror="setLogoFallback(this)">`
      : `<img src="images/sets/${setId}.png" alt="${set.name}" onerror="setLogoFallback(this)">`}
    <div>
      <h1>${set.name}</h1>
      <div class="meta">${[serie, year, total + ' cartes'].filter(Boolean).join(' · ')}</div>
      <div id="progression-extension"></div>
      ${reserves.length ? `<div class="meta avertissement" title="Cela se corrigera tout seul quand la source publiera sa version française.">${reserves.join(' · ')} — la source n'a pas encore de version française.</div>` : ''}
    </div>
  `;
}

function renderCards(cards){
  const content = document.getElementById('content');
  if(cards.length === 0){
    content.innerHTML = '<p class="status-msg">Aucune carte ne correspond à ce filtre.</p>';
    return;
  }
  content.innerHTML = `<div class="card-grid">${cards.map(c => cardTile(c)).join('')}</div>`;
}

document.getElementById('content').addEventListener('click', (e) => {
  // Un bouton désactivé n'émet pas de clic : c'est son enveloppe qui le
  // reçoit, et qui porte la raison du refus.
  const bloque = e.target.closest('.ech-bloque');
  if(bloque){ messageFugace(bloque.dataset.raison); return; }

  const btn = e.target.closest('.tag-toggle');
  if(!btn) return;
  toggleTag(btn.dataset.id, btn.dataset.tag);
  applyFilters();
});

function showSaveStatus(state){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(state === 'saving') el.textContent = 'Enregistrement…';
  if(state === 'saved') el.textContent = 'Enregistré ✓';
  if(state === 'error') el.textContent = "Échec de l'enregistrement";
  if(state === 'hors-ligne') el.textContent = 'Enregistré ici, pas encore en ligne';
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

function filteredCards(){
  const q = document.getElementById('filter-input').value.trim().toLowerCase();
  const rarity = document.getElementById('rarity-filter').value;
  let filtered = allCards;
  if(q) filtered = filtered.filter(c => c.name.toLowerCase().includes(q) || (c.localId || '').includes(q));
  if(rarity) filtered = filtered.filter(c => c.rarity === rarity);
  if(activeFilter === 'manq') filtered = filtered.filter(c => !tagState[c.id]?.obt);
  else if(activeFilter) filtered = filtered.filter(c => tagState[c.id]?.[activeFilter]);
  return filtered;
}

// La barre de l'en-tête compte toute l'extension, jamais le sous-ensemble
// affiché : filtrer sur « Manquantes » ne doit pas faire tomber la
// progression à zéro.
function majProgression(){
  const boite = document.getElementById('progression-extension');
  if(!boite || allCards.length === 0) return;
  boite.innerHTML = barreProgression(progressionDesCartes(allCards), { large: true });
}

function applyFilters(){
  const filtered = trierCartes(filteredCards());
  renderCards(filtered);
  majProgression();
  const count = filtered.length;
  document.getElementById('bulk-count').textContent =
    count === allCards.length ? `les ${count} cartes` : `les ${count} cartes affichées`;
}

document.getElementById('filter-input').addEventListener('input', applyFilters);
document.getElementById('rarity-filter').addEventListener('change', applyFilters);

document.querySelectorAll('.bulk-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    bulkToggleTag(filteredCards(), btn.dataset.bulk);
    applyFilters();
  });
});

// Les filtres s'excluent : en activer un désactive les autres.
FILTERS.forEach(filter => {
  document.getElementById(`btn-${filter}`).addEventListener('click', () => {
    activeFilter = activeFilter === filter ? null : filter;
    FILTERS.forEach(f => {
      document.getElementById(`btn-${f}`).classList.toggle('on', activeFilter === f);
    });
    applyFilters();
  });
});

installerTri(() => allCards, applyFilters);

init();
</script>

</body>
</html>

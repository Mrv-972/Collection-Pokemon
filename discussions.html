<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --teal:#1F6F63; --teal-deep:#123F38;
    --rust:#A8431C; --gold:#C9A227; --gold-rgb:201,162,39; --accent-clair:var(--accent-clair); --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(237,234,224,0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a.active{color:var(--text-on-ink)}
  .navlinks a:hover{color:var(--text-on-ink)}

  .page-head{padding:48px 0 26px;}
  .kicker{color:var(--gold);font-size:13px;font-weight:500;margin-bottom:10px;}
  .page-head h1{font-size:36px;}

  .messagerie{display:grid;grid-template-columns:280px 1fr;gap:20px;padding-bottom:70px;align-items:start;}
  @media(max-width:800px){.messagerie{grid-template-columns:1fr}}

  .colonne-liste{display:flex;flex-direction:column;gap:10px;}
  .filtres-conv{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink-dim);padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;}
  .chip:hover{color:var(--text-on-ink)}
  .chip.on{color:var(--accent-clair);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.1)}

  .liste{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:6px;overflow:hidden;}
  .conv{display:block;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid rgba(237,234,224,0.06);padding:14px 16px;cursor:pointer;font-family:inherit;color:inherit;}
  .conv:last-child{border-bottom:none}
  .conv:hover{background:rgba(237,234,224,0.03)}
  .conv.on{background:rgba(var(--gold-rgb),0.1)}
  .conv .qui{font-size:14px;font-weight:500;}
  .conv .apercu{font-size:12px;color:var(--text-on-ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .liste .vide{padding:18px 16px;font-size:13px;color:var(--text-on-ink-dim);}

  .fil{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:6px;display:flex;flex-direction:column;min-height:460px;}
  .fil-tete{padding:16px 20px;border-bottom:1px solid rgba(237,234,224,0.08);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .fil-tete h2{font-size:19px;}
  .fil-tete a{font-size:12.5px;color:var(--text-on-ink-dim);text-decoration:underline;text-underline-offset:3px;}
  .fil-tete a:hover{color:var(--text-on-ink)}

  .prevention{margin:0;padding:12px 20px;background:rgba(var(--gold-rgb),0.08);border-bottom:1px solid rgba(var(--gold-rgb),0.2);font-size:12.5px;color:#D8CFA8;}
  .fil-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;}
  .fil-actions button{background:transparent;border:1px solid rgba(237,234,224,0.14);color:var(--text-on-ink-dim);padding:5px 11px;border-radius:3px;font-size:12px;cursor:pointer;font-family:inherit;}
  .fil-actions button:hover{border-color:rgba(237,234,224,0.35);color:var(--text-on-ink)}
  .fil-actions button.danger:hover{border-color:rgba(168,67,28,0.6);color:#E08862}
  .conv .pastille{display:inline-block;min-width:18px;padding:1px 5px;margin-left:6px;border-radius:9px;background:#A8431C;color:#F6EFEA;font-size:11px;font-weight:600;line-height:16px;text-align:center;}
  .conv .qui{display:flex;align-items:center;justify-content:space-between;gap:8px;}

  .fil-corps{flex:1;overflow-y:auto;max-height:52vh;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .bulle{max-width:74%;padding:9px 13px;border-radius:12px;font-size:14px;word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;}
  .bulle .heure{display:block;font-size:10.5px;opacity:.6;margin-top:4px;}
  .bulle.moi{align-self:flex-end;background:var(--teal-deep);color:#EDF5F3;border-bottom-right-radius:4px;}
  .bulle.lui{align-self:flex-start;background:rgba(237,234,224,0.07);border-bottom-left-radius:4px;}

  .fil-pied{padding:14px 16px;border-top:1px solid rgba(237,234,224,0.08);display:flex;gap:10px;}
  .fil-pied textarea{flex:1;resize:none;background:var(--ink);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:10px 13px;border-radius:4px;font-size:14px;font-family:inherit;line-height:1.4;max-height:120px;}
  .fil-pied textarea:focus{outline:none;border-color:rgba(var(--gold-rgb),0.5)}
  .fil-pied button{background:var(--teal);border:none;color:#EDF5F3;padding:0 18px;border-radius:4px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  .fil-pied button:hover{background:var(--teal-deep)}
  .fil-pied button:disabled{opacity:.5;cursor:default}

  .status-msg{color:var(--text-on-ink-dim);font-size:15px;padding:28px 0;}
  .status-msg.err{color:#E08862}
  .cta-btn{display:inline-block;margin-top:16px;background:var(--teal);color:#EDF5F3;padding:11px 20px;border-radius:3px;font-size:14px;font-weight:500;}
  .cta-btn:hover{background:var(--teal-deep)}
  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(237,234,224,0.08);}

  /* ========================= Téléphone =========================
     Les liens de navigation passaient en display:none sous 720 px : depuis
     un téléphone, on ne pouvait plus aller d'une section à l'autre du tout.
     Ils descendent maintenant sur une deuxième ligne de la barre, toujours
     visibles, et assez hauts pour être touchés sans viser. La règle de
     débordement horizontal n'est là que pour les très petits écrans, où
     quatre libellés ne tiennent plus côte à côte.

     Le reste resserre des marges verticales taillées pour un grand écran,
     et porte les commandes à une hauteur tactile confortable — en bas de
     42 px, un doigt touche la voisine une fois sur trois. */
  @media(max-width:720px){
    nav{flex-wrap:wrap;padding:18px 0 0;}
    .navlinks{display:flex;order:3;width:100%;gap:4px;font-size:12.5px;
              justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
    .navlinks::-webkit-scrollbar{display:none}
    .navlinks a{white-space:nowrap;padding:12px 6px;border-bottom:2px solid transparent;}
    .navlinks a.active{border-bottom-color:currentColor;}
    .brand{font-size:19px;padding:6px 0}
    .compte-lien{padding:11px 0 11px 12px}

    .page-head{padding:28px 0 20px}
    .page-head h1{font-size:27px}
    .chip{padding:10px 14px}
    .fil{min-height:0}
    .fil-corps{max-height:56vh}
    .fil-tete{padding:14px 16px}
    .fil-actions button{min-height:38px}
    .fil-pied textarea{min-height:44px}
    .fil-pied button{min-height:44px}
  }
</style>

<div class="wrap">

  </div>

  <footer data-note="Les discussions ne sont lisibles que par leurs deux participants."></footer>

<script src="univers.js?v=2026-09-22-os92"></script>
<script src="supabase-config.js?v=2026-09-22-os92"></script>
<script src="pied.js?v=2026-09-22-os92"></script>
<script src="admin.js?v=2026-09-22-os92"></script>
<script src="tags.js?v=2026-09-22-os92"></script>

<script>
const params = new URLSearchParams(window.location.search);
const membreDemande = params.get('membre'); // conversation à ouvrir d'emblée

let conversations = [];
let conversationOuverte = null;  // { conversation_id, autre_id, pseudo }
let dernierMessageId = 0;
let arreterSuivi = null;

function rendreSquelette(){
  document.getElementById('content').innerHTML = `
    <div class="messagerie">
      <div class="colonne-liste">
        <div class="filtres-conv" id="filtres-conv"></div>
        <div class="liste" id="liste"></div>
      </div>
      <div class="fil" id="fil"></div>
    </div>
  `;
}

// Les trois vues de la liste. Une discussion archivée sort des « Actives »
// mais y revient d'elle-même dès qu'on t'écrit : ranger ne doit jamais
// revenir à manquer un message.
const FILTRES = [
  { cle: 'actives',   libelle: 'Actives' },
  { cle: 'non_lues',  libelle: 'Non lues' },
  { cle: 'archivees', libelle: 'Archivées' },
];
let filtreActif = 'actives';

function correspondAuFiltre(c, cle){
  if(cle === 'archivees') return c.archivee;
  if(cle === 'non_lues')  return c.non_lus > 0 && !c.archivee;
  return !c.archivee;
}

function compterFiltre(cle){
  return conversations.filter(c => correspondAuFiltre(c, cle)).length;
}

function rendreFiltres(){
  const barre = document.getElementById('filtres-conv');
  if(!barre) return;
  barre.innerHTML = FILTRES.map(f => {
    const nombre = compterFiltre(f.cle);
    // Inutile de proposer les archives à qui n'en a pas.
    if(f.cle === 'archivees' && nombre === 0 && filtreActif !== 'archivees') return '';
    const compte = f.cle === 'actives' || nombre === 0 ? '' : ` (${nombre})`;
    return `<button class="chip ${filtreActif === f.cle ? 'on' : ''}" data-filtre="${f.cle}">${f.libelle}${compte}</button>`;
  }).join('');
}

function listeVide(){
  if(filtreActif === 'non_lues')  return 'Tout est lu.';
  if(filtreActif === 'archivees') return 'Aucune discussion archivée.';
  const archivees = compterFiltre('archivees');
  return archivees > 0
    ? `Aucune discussion active. Tu en as ${archivees} dans les archives.`
    : `Aucune discussion pour l'instant. Ouvre-en une depuis la page Échanges.`;
}

function rendreListe(){
  const liste = document.getElementById('liste');
  const visibles = conversations.filter(c => correspondAuFiltre(c, filtreActif));
  if(visibles.length === 0){
    liste.innerHTML = `<p class="vide">${listeVide()}</p>`;
    return;
  }
  liste.innerHTML = visibles.map(c => `
    <button class="conv ${conversationOuverte?.conversation_id === c.conversation_id ? 'on' : ''}" data-id="${c.conversation_id}">
      <div class="qui">${texteEchappe(c.pseudo)}${c.non_lus > 0 ? `<span class="pastille">${c.non_lus}</span>` : ''}</div>
      <div class="apercu">${c.dernier_message ? texteEchappe(c.dernier_message) : 'Discussion ouverte, rien d\'envoyé'}</div>
    </button>
  `).join('');
}

function rendreFil(){
  const fil = document.getElementById('fil');
  if(!conversationOuverte){
    fil.innerHTML = `<p class="status-msg" style="padding:28px 20px">Choisis une discussion dans la liste, ou lances-en une depuis la page Échanges.</p>`;
    return;
  }
  fil.innerHTML = `
    <div class="fil-tete">
      <h2>${texteEchappe(conversationOuverte.pseudo)}</h2>
      <a href="echanges.html">Voir les échanges possibles</a>
      <div class="fil-actions">
        <button id="btn-archiver">${conversationOuverte.archivee ? 'Sortir des archives' : 'Archiver'}</button>
        <button id="btn-supprimer" class="danger">Supprimer</button>
        <button id="btn-signaler">Signaler</button>
        <button id="btn-bloquer" class="danger">Bloquer</button>
      </div>
    </div>
    <p class="prevention">Tu discutes avec quelqu'un que tu ne connais pas. Ne communique ni adresse, ni numéro de téléphone, ni coordonnées bancaires. Pour un envoi, privilégie un mode de remise suivi, et méfie-toi de quiconque insiste pour sortir de la plateforme ou t'envoyer un lien.</p>
    <div class="fil-corps" id="fil-corps"></div>
    <div class="fil-pied">
      <textarea id="saisie" rows="1" placeholder="Écris ton message…"></textarea>
      <button id="btn-envoyer">Envoyer</button>
    </div>
  `;
  document.getElementById('btn-envoyer').addEventListener('click', envoyer);
  document.getElementById('btn-archiver').addEventListener('click', archiver);
  document.getElementById('btn-supprimer').addEventListener('click', supprimer);
  document.getElementById('btn-bloquer').addEventListener('click', bloquer);
  document.getElementById('btn-signaler').addEventListener('click', signaler);
  const saisie = document.getElementById('saisie');
  saisie.addEventListener('keydown', (e) => {
    // Entrée envoie, Maj+Entrée passe à la ligne.
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); envoyer(); }
  });
  saisie.addEventListener('input', () => {
    saisie.style.height = 'auto';
    saisie.style.height = Math.min(saisie.scrollHeight, 120) + 'px';
  });
  saisie.focus();
}

function ajouterMessages(messages){
  const corps = document.getElementById('fil-corps');
  if(!corps) return;
  const enBas = corps.scrollHeight - corps.scrollTop - corps.clientHeight < 60;
  corps.insertAdjacentHTML('beforeend', messages.map(m => `
    <div class="bulle ${m.auteur_id === membre.id ? 'moi' : 'lui'}">${texteEchappe(m.texte)}<span class="heure">${heureLisible(m.envoye_le)}</span></div>
  `).join(''));
  // On ne repositionne la vue que si le lecteur était déjà en bas : sinon
  // il est en train de relire, et on ne lui arrache pas sa lecture.
  if(enBas || messages.some(m => m.auteur_id === membre.id)){
    corps.scrollTop = corps.scrollHeight;
  }
}

async function ouvrirFil(conversation){
  conversationOuverte = conversation;
  dernierMessageId = 0;
  rendreListe();
  rendreFil();
  const messages = await lireMessages(conversation.conversation_id);
  if(messages.length) dernierMessageId = messages[messages.length - 1].id;
  ajouterMessages(messages);
  await noterCommeLu();
}

// Ouvrir un fil vaut lecture : on mémorise où on en est, ici et pour la
// pastille de la navigation.
async function noterCommeLu(){
  if(!conversationOuverte || !dernierMessageId) return;
  try{
    await marquerLu(conversationOuverte.conversation_id, dernierMessageId);
    if(typeof afficherNonLus === 'function') afficherNonLus();
  }catch(err){
    console.warn('Marquage de lecture impossible', err);
  }
}

async function envoyer(){
  const saisie = document.getElementById('saisie');
  const bouton = document.getElementById('btn-envoyer');
  const texte = saisie.value.trim();
  if(!texte || !conversationOuverte) return;

  bouton.disabled = true;
  try{
    const message = await envoyerMessage(conversationOuverte.conversation_id, texte);
    dernierMessageId = Math.max(dernierMessageId, message.id);
    ajouterMessages([message]);
    saisie.value = '';
    saisie.style.height = 'auto';
    await rafraichirListe();
  }catch(err){
    console.warn('Envoi impossible', err);
    alert("Le message n'est pas parti : " + (err.message ?? err));
  }finally{
    bouton.disabled = false;
    saisie.focus();
  }
}

async function archiver(){
  const conv = conversationOuverte;
  if(!conv) return;
  const aArchiver = !conv.archivee;
  try{
    await archiverConversation(conv.conversation_id, aArchiver);
    // En la ressortant, on remet la vue sur les discussions actives, sinon
    // elle disparaîtrait de l'écran au moment même où on la récupère.
    if(!aArchiver) filtreActif = 'actives';
    await rafraichirListe();
    const maj = conversations.find(c => c.conversation_id === conv.conversation_id);
    conversationOuverte = maj && correspondAuFiltre(maj, filtreActif) ? maj : null;
    rendreListe();
    rendreFil();
  }catch(err){
    alert("L'archivage a échoué : " + (err.message ?? err));
  }
}

async function supprimer(){
  const conv = conversationOuverte;
  if(!conv) return;
  // Le message dit exactement ce qui se passe : la moitié de la discussion
  // appartient à quelqu'un d'autre, et elle ne s'efface pas.
  if(!confirm(
    `Supprimer la discussion avec ${conv.pseudo} ?\n\n`
    + `Elle quittera ta liste et tu n'en verras plus les messages.\n\n`
    + `${conv.pseudo} gardera la sienne : on ne peut pas effacer ce qu'on a déjà envoyé à quelqu'un. `
    + `Si cette personne t'écrit à nouveau, la discussion reviendra — avec les nouveaux messages seulement.`
  )) return;

  try{
    await supprimerConversation(conv.conversation_id);
    conversationOuverte = null;
    await rafraichirListe();
    rendreListe();
    rendreFil();
    if(typeof afficherNonLus === 'function') afficherNonLus();
  }catch(err){
    alert("La suppression a échoué : " + (err.message ?? err));
  }
}

async function bloquer(){
  const qui = conversationOuverte.pseudo;
  if(!confirm(`Bloquer ${qui} ?\n\nVous ne pourrez plus vous écrire, et vous n'apparaîtrez plus dans les échanges possibles l'un de l'autre. C'est réversible depuis ton compte.`)) return;
  try{
    await bloquerMembre(conversationOuverte.autre_id);
    conversationOuverte = null;
    await rafraichirListe();
    rendreFil();
  }catch(err){
    alert('Le blocage a échoué : ' + (err.message ?? err));
  }
}

async function signaler(){
  const motif = prompt(`Que reproches-tu à ${conversationOuverte.pseudo} ?\n\nDécris ce qui s'est passé ; le signalement sera examiné.`);
  if(!motif || !motif.trim()) return;
  try{
    await signalerMembre(conversationOuverte.autre_id, motif);
    alert('Signalement envoyé. Si cette personne te met mal à l\'aise, tu peux aussi la bloquer.');
  }catch(err){
    alert("Le signalement n'est pas parti : " + (err.message ?? err));
  }
}

async function rafraichirListe(){
  conversations = await listerConversations();
  // La conversation ouverte est un objet de cette liste : sans cette reprise,
  // son drapeau « archivée » resterait celui du chargement précédent.
  if(conversationOuverte){
    const maj = conversations.find(c => c.conversation_id === conversationOuverte.conversation_id);
    if(maj) conversationOuverte = maj;
  }
  rendreFiltres();
  rendreListe();
}

// Va chercher ce qui est arrivé depuis le dernier message connu.
async function rafraichir(){
  if(conversationOuverte){
    const nouveaux = await lireMessages(conversationOuverte.conversation_id, dernierMessageId);
    if(nouveaux.length){
      dernierMessageId = nouveaux[nouveaux.length - 1].id;
      ajouterMessages(nouveaux);
      // Le fil est sous les yeux du lecteur : ces messages sont lus.
      if(document.visibilityState === 'visible') await noterCommeLu();
    }
  }
  await rafraichirListe();
}

async function init(){
  const content = document.getElementById('content');
  loadTags();
  await initCompte();
  afficherEtatCompte();

  if(CONFIG_MANQUANTE){
    content.innerHTML = `<p class="status-msg err">La base en ligne n'est pas encore configurée.</p>`;
    return;
  }
  if(!estConnecte()){
    content.innerHTML = `<p class="status-msg">Les discussions sont réservées aux membres.
      <br><a class="cta-btn" href="connexion.html">Se connecter ou créer un compte</a></p>`;
    return;
  }

  rendreSquelette();
  try{
    await rafraichirListe();

    // Arrivée depuis la page Échanges : on ouvre directement la discussion
    // avec ce membre, en la créant si c'est la première fois.
    if(membreDemande){
      const idConv = await ouvrirConversation(membreDemande);
      await rafraichirListe();
      let conv = conversations.find(c => c.conversation_id === idConv);
      if(!conv){
        // Discussion précédemment supprimée : on la rouvre pour écrire, sans
        // faire réapparaître les messages effacés.
        conv = {
          conversation_id: idConv,
          autre_id: membreDemande,
          pseudo: await pseudoDe(membreDemande) ?? 'Membre',
          non_lus: 0,
          archivee: false,
        };
      }
      // Rangée puis rouverte volontairement : on montre la vue où elle est.
      if(conv.archivee) filtreActif = 'archivees';
      rendreFiltres();
      await ouvrirFil(conv);
    }else{
      rendreFil();
    }

    arreterSuivi = suivreEnContinu(rafraichir);
  }catch(err){
    console.warn('Discussions indisponibles', err);
    content.innerHTML = `<p class="status-msg err">Impossible de charger les discussions.<br>
      <span style="font-size:12px;opacity:.7">${err.message ?? err}</span></p>`;
  }
}

document.addEventListener('click', (e) => {
  const puce = e.target.closest('[data-filtre]');
  if(puce){
    filtreActif = puce.dataset.filtre;
    // La discussion ouverte n'a plus sa place dans cette vue : on la ferme
    // plutôt que de la laisser surlignée dans une liste où elle ne figure pas.
    if(conversationOuverte && !correspondAuFiltre(conversationOuverte, filtreActif)){
      conversationOuverte = null;
      rendreFil();
    }
    rendreFiltres();
    rendreListe();
    return;
  }

  const bouton = e.target.closest('.conv');
  if(!bouton) return;
  const conv = conversations.find(c => c.conversation_id === bouton.dataset.id);
  if(conv) ouvrirFil(conv);
});

init();
</script>

</html>

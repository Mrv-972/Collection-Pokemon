# Lit les guides francophones sur les missions secrètes et dépose le relevé
# brut dans donnees/missions-brutes.json, pour relecture.
#
# Lancé à la main : c'est une lecture ponctuelle, pas une dépendance du site.
# Le fichier produit est un relevé, pas une vérité — rien ne s'en sert tant
# qu'il n'a pas été relu.
name: Moissonner les missions secrètes

on:
  workflow_dispatch:
    inputs:
      guide:
        description: "Numéro du guide (vide = tous)"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  moissonner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          GUIDE: ${{ inputs.guide }}
        run: node outils/moissonner-missions.mjs $GUIDE
      - name: Déposer le relevé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees/missions-brutes.json
          git diff --cached --quiet || git commit -m "Relevé des guides sur les missions secrètes"
          git push

# Mesure le manque de visuels du TCG physique.
#
# Le bac à sable de développement n'atteint pas le serveur d'images ; un
# exécuteur GitHub, si. Rien n'est écrit dans le dépôt : on lit le journal.
name: Sonde des visuels physiques

on:
  workflow_dispatch:
    inputs:
      par-extension:
        description: "Cartes sondées par extension"
        default: "5"

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sonder
        run: node outils/sonde-visuels-physiques.mjs --instantane donnees --par-extension "${{ inputs.par-extension }}"

      - name: Éclaircir les extensions muettes
        run: node outils/sonde-adresses-tcgdex.mjs --instantane donnees

      - name: Récupérer la deuxième source
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/PokemonTCG/pokemon-tcg-data /tmp/ptcgdata
          cd /tmp/ptcgdata
          git sparse-checkout init --cone
          git sparse-checkout set sets cards/en
          git checkout

      - name: Éprouver la deuxième source
        run: node outils/sonde-source-pokemontcg.mjs --instantane donnees --source /tmp/ptcgdata

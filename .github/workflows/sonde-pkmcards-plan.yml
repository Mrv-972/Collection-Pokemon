# Repère par où PkmCards se laisse parcourir. Lecture seule, à la demande.
name: Sonde plan PkmCards

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node outils/sonde-pkmcards-plan.mjs

name: Sonder les visuels français

on:
  workflow_dispatch:
    inputs:
      echantillon:
        description: "Cartes testées par extension"
        required: false
        default: '3'
      toutes:
        description: "Sonder aussi les sources déjà allumées"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  sonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sonder
        run: |
          node outils/sonde-visuels.mjs \
            --echantillon=${{ inputs.echantillon }} \
            ${{ inputs.toutes && '--toutes' || '' }} \
            | tee rapport-visuels.txt

      - name: Garder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-visuels
          path: rapport-visuels.txt

name: Actualités Pokémon

on:
  schedule:
    - cron: '23 6,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depot-donnees
  cancel-in-progress: false

jobs:
  recolter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lire les actualités
        run: node outils/actualites.mjs --sortie donnees
      - name: Publier si elles ont changé
        run: |
          git config user.name  "Actualités Pokémon"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/actualites.json
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -q -m "Met à jour les actualités Pokémon"
          for essai in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME"; then
              echo "déposé."; exit 0
            fi
            sleep $((essai * 5))
          done
          echo "::error::dépôt impossible après cinq tentatives."; exit 1

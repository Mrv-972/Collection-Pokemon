name: Explorer une page

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse(s) à explorer, séparées par des virgules"
        required: true
        default: 'https://pokemon-tcg-pocket.wiki/fr/cards'
      suivre:
        description: "Ouvrir aussi les scripts chargés par la page"
        type: boolean
        required: false
        default: true
      contexte:
        description: "Afficher le code autour de ce motif"
        required: false
        default: ''
      filtre:
        description: "Ne garder que les adresses correspondant à ceci"
        required: false
        default: 'jsdelivr|/api/|\.json|githubusercontent|cdn\.'

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node outils/explorer.mjs \
            --url="$URL" \
            --filtre="$FILTRE" \
            ${SUIVRE:+--suivre} \
            ${CONTEXTE:+--contexte="$CONTEXTE"}
        env:
          URL: ${{ inputs.url }}
          FILTRE: ${{ inputs.filtre }}
          CONTEXTE: ${{ inputs.contexte }}
          SUIVRE: ${{ inputs.suivre && '1' || '' }}

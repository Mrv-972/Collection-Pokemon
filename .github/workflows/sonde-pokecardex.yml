# Éprouve Pokécardex comme source des visuels qui manquent. Lecture seule.
name: Sonde Pokécardex

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node outils/sonde-pokecardex.mjs

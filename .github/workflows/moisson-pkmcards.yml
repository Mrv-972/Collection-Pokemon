name: Moisson PkmCards

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages à lire (0 = toutes, environ 576)"
        default: "0"
      essai:
        description: "Essai : ne rien écrire dans le dépôt"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  moissonner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Relever les visuels
        run: |
          node outils/moissonner-pkmcards.mjs \
            --sortie donnees \
            --pages "${{ inputs.pages }}" \
            ${{ inputs.essai && '--essai' || '' }}

      - name: Garder le relevé en pièce jointe
        if: ${{ !inputs.essai }}
        uses: actions/upload-artifact@v4
        with:
          name: visuels-pkmcards
          path: donnees/visuels-pkmcards.json
          retention-days: 7

      - name: Publier le relevé s'il a changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name  "Moisson PkmCards"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/visuels-pkmcards.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Relève les visuels français chez PkmCards"
          for essai in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" \
               && git push -q origin HEAD:"$GITHUB_REF_NAME"; then
              echo "déposé."
              exit 0
            fi
            echo "dépôt refusé (tentative $essai) : on reprend la branche et on réessaie."
            sleep $((essai * 5))
          done
          echo "::error::dépôt impossible après cinq tentatives."
          exit 1

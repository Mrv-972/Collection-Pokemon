# Relève les visuels français chez PkmCards, par son paginateur /cards/<numéro>.
#
# À la demande seulement : rien n'est branché sur la construction nocturne
# tant que la question de l'autorisation n'est pas réglée.
name: Moisson PkmCards

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages à lire (0 = toutes, environ 576)"
        default: "0"
      essai:
        description: "Essai : ne rien écrire dans le dépôt"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  moissonner:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Relever les visuels
        run: |
          node outils/moissonner-pkmcards.mjs \
            --sortie donnees \
            --pages "${{ inputs.pages }}" \
            ${{ inputs.essai && '--essai' || '' }}

      # Un filet : si le dépôt refuse encore, le relevé reste
      # téléchargeable depuis l'exécution plutôt que perdu avec l'exécuteur.
      - name: Garder le relevé en pièce jointe
        if: ${{ !inputs.essai }}
        uses: actions/upload-artifact@v4
        with:
          name: visuels-pkmcards
          path: donnees/visuels-pkmcards.json
          retention-days: 7

      - name: Publier le relevé s'il a changé
        if: ${{ !inputs.essai }}
        run: |
          git config user.name  "Moisson PkmCards"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/visuels-pkmcards.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Relève les visuels français chez PkmCards"
          git push

# Éprouve Poképédia comme source de visuels français. Lecture seule, à la demande.
name: Sonde Poképédia

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages de 500 fichiers à lire (0 = toutes)"
        default: "0"

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node outils/sonde-pokepedia.mjs --pages "${{ inputs.pages }}" --sortie /tmp

      - name: Garder le relevé
        uses: actions/upload-artifact@v4
        with:
          name: pokepedia-series
          path: /tmp/pokepedia-series.json
          retention-days: 7

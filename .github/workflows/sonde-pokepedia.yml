# Éprouve Poképédia comme source de visuels français. Lecture seule, à la demande.
name: Sonde Poképédia

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages de 500 fichiers à lire (0 = toutes)"
        default: "0"

permissions:
  contents: write

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node outils/sonde-pokepedia.mjs --pages "${{ inputs.pages }}" --sortie donnees

      - name: Garder le relevé
        uses: actions/upload-artifact@v4
        with:
          name: pokepedia-series
          path: donnees/pokepedia-series.json
          retention-days: 7

      - name: Publier le relevé s'il a changé
        run: |
          git config user.name  "Sonde Poképédia"
          git config user.email "actions@users.noreply.github.com"
          git add donnees/pokepedia-series.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Relève les séries de cartes de Poképédia"
          for essai in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin "$GITHUB_REF_NAME" \
               && git push -q origin HEAD:"$GITHUB_REF_NAME"; then
              echo "déposé."
              exit 0
            fi
            echo "dépôt refusé (tentative $essai) — on reprend la branche et on réessaie."
            sleep $((essai * 5))
          done
          echo "::error::dépôt impossible après cinq tentatives."
          exit 1

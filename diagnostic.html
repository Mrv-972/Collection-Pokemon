<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic — PokéClasseur</title>
<style>
  :root{--ink:#15171B;--ink-soft:#20232A;--gold:#C9A227;--accent-clair:#E3C766;
        --teal:#1F6F63;--text:#EDEAE0;--dim:#9B9E9C;}
  *{box-sizing:border-box}
  body{margin:0;padding:26px 18px 70px;background:var(--ink);color:var(--text);
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.55;}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-family:Georgia,serif;font-weight:500;font-size:25px;margin:0 0 6px}
  p.intro{color:var(--dim);margin:0 0 20px;font-size:13px}
  .onglets{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  button{background:var(--ink-soft);border:1px solid rgba(237,234,224,.15);color:var(--text);
         padding:10px 16px;border-radius:4px;font-size:13px;font-family:inherit;cursor:pointer}
  button.on{background:var(--teal);border-color:var(--teal);color:#EDF5F3}
  button.copier{background:var(--teal);border:none;color:#EDF5F3}
  pre{background:var(--ink-soft);border:1px solid rgba(237,234,224,.1);border-radius:5px;
      padding:16px;white-space:pre-wrap;word-break:break-word;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnostic</h1>
  <p class="intro">Cette page interroge le site depuis ton navigateur et dit exactement ce qu'il
     charge, d'où, et dans quelle langue. Choisis l'univers, puis copie le rapport.</p>
  <div class="onglets">
    <button id="b-physique" class="on">Jeu physique</button>
    <button id="b-pocket">TCG Pocket</button>
    <button class="copier" id="copier">Tout copier</button>
  </div>
  <pre id="sortie">…</pre>
</div>

<script src="sets.js?v=2026-09-20-25et"></script>
<script src="univers.js?v=2026-09-20-25et"></script>
<script src="catalogue.js?v=2026-09-20-25et"></script>
<script>
const sortie = document.getElementById('sortie');
let lignes = [];
const dire = (t = '') => { lignes.push(t); sortie.textContent = lignes.join('\n'); };

// On mesure la « francité » d'une liste de noms en la confrontant au Pokédex
// français : c'est le seul juge fiable, et il ne dépend d'aucune source.
let pokedex = null;
async function chargerPokedex(){
  if(pokedex) return pokedex;
  await new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = 'pokedex-fr.js'; s.onload = ok; s.onerror = ko;
    document.head.appendChild(s);
  }).catch(() => {});
  const norm = n => String(n).normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
  pokedex = typeof POKEDEX_FR !== 'undefined' ? new Set(POKEDEX_FR.map(norm)) : new Set();
  pokedex.norm = norm;
  return pokedex;
}

async function essai(adresse){
  try{
    const r = await fetch(adresse, { cache: 'no-store' });
    return { ok: r.ok, statut: r.status, corps: r.ok ? await r.json() : null };
  }catch(err){
    return { ok: false, statut: 'erreur réseau', message: err.message };
  }
}

async function rapport(universVoulu){
  lignes = [];
  adopterUnivers(universVoulu);
  const p = await chargerPokedex();

  dire(`Adresse      : ${location.href}`);
  dire(`Univers      : ${universActuel().cle}`);
  dire(`catalogue.js : ${typeof CATALOGUE_VERSION !== 'undefined' ? CATALOGUE_VERSION : 'ANCIENNE VERSION (sans repère) — ton navigateur sert un fichier en cache'}`);
  dire(`Pokédex fr   : ${p.size} noms chargés`);
  dire();

  dire('--- L\'instantané local est-il servi ? -------------------------');
  const version = await essai('donnees/version.json');
  dire(`  donnees/version.json → ${version.statut}`);
  if(version.ok){
    dire(`  construit le ${version.corps.genere_le}`);
    dire(`  physique : ${version.corps.physique.extensions} extensions, ${version.corps.physique.cartes} cartes`);
    dire(`  pocket   : ${version.corps.pocket.extensions} extensions, ${version.corps.pocket.cartes} cartes`);
  }else{
    dire('  ABSENT — le site retombe sur les sources en direct.');
  }
  dire();

  const u = universActuel().cle;
  dire('--- Le fichier brut de l\'instantané ---------------------------');
  const brut = await essai(`donnees/${u}/extensions.json`);
  dire(`  donnees/${u}/extensions.json → ${brut.statut}`);
  if(brut.ok) dire(`  ${brut.corps.length} extensions · ${brut.corps.slice(-4).map(e => e.name).join(' · ')}`);
  dire();

  dire('--- Ce que le site affiche réellement --------------------------');
  let extensions = [];
  try{
    extensions = await listerExtensions();
    dire(`  listerExtensions() → ${extensions.length} extensions`);
    dire(`  quatre dernières : ${extensions.slice(-4).map(e => e.name).join(' · ')}`);
  }catch(err){ dire(`  listerExtensions() a échoué : ${err.message}`); }
  dire();

  dire('--- Les cartes de trois extensions -----------------------------');
  const aTester = extensions.filter(e => appartientAUnivers(e.id)).slice(-3);
  for(const ext of aTester){
    try{
      const cartes = await cartesDeLExtension(ext.id);
      const noms = cartes.map(c => c.name);
      const simples = noms.map(p.norm).filter(n => n.length > 2);
      const francais = simples.filter(n => p.has(n)).length;
      const part = simples.length ? Math.round(100 * francais / simples.length) : 0;
      dire(`  ${ext.id.padEnd(8)} ${String(cartes.length).padStart(4)} cartes · ${part}% reconnus au Pokédex français`);
      dire(`           ${noms.slice(0, 6).join(', ')}`);
    }catch(err){ dire(`  ${ext.id} : échec — ${err.message}`); }
  }
  dire();

  dire('--- Les visuels des cartes -------------------------------------');
  // Je ne peux pas joindre l'hébergeur d'images depuis mon environnement :
  // c'est donc ton navigateur qui dit lesquels existent vraiment.
  const echantillon = [];
  // Un échantillon pris aux deux bouts : les plus anciennes, censées avoir
  // leur visuel français, et les plus récentes, qui n'en ont nulle part.
  const miennes = extensions.filter(e => appartientAUnivers(e.id));
  const aSonder = [...miennes.slice(0, 3), ...miennes.slice(-3)];
  for(const ext of aSonder){
    try{
      const cartes = await cartesDeLExtension(ext.id);
      if(cartes[0]?.image) echantillon.push({ ext: ext.id, carte: cartes[0] });
    }catch(err){}
  }
  for(const { ext, carte } of echantillon){
    const hote = new URL(carte.image, location.href).hostname.replace('www.', '');
    const charge = await new Promise(ok => {
      const img = new Image();
      img.onload = () => ok(`${img.naturalWidth}×${img.naturalHeight}`);
      img.onerror = () => ok(null);
      img.src = carte.image;
    });
    const langue = carte.image.startsWith('images/') ? 'ton propre visuel'
      : hote.includes('tcgdex') ? 'FRANÇAIS attendu'
      : 'anglais (seule version publiée)';
    dire(`  ${ext.padEnd(7)} ${(charge ?? 'NE CHARGE PAS').padEnd(14)} ${langue}`);
    dire(`          ${carte.image.replace(/^https?:\/\//, '')}`);
  }
  dire();

  dire('--- Caches du navigateur ---------------------------------------');
  const cles = [];
  try{ for(let i = 0; i < sessionStorage.length; i++) cles.push(sessionStorage.key(i)); }catch(err){}
  dire(cles.length ? '  session : ' + cles.join(', ') : '  session : vide');

  // Distinguer « le serveur n'a pas publié » de « ton navigateur garde
  // l'ancien fichier » : on redemande catalogue.js en contournant le cache
  // et on regarde s'il porte le repère de version.
  let surLeServeur = null;
  try{
    const r = await fetch('catalogue.js?' + Date.now(), { cache: 'no-store' });
    surLeServeur = (await r.text()).includes('CATALOGUE_VERSION');
  }catch(err){}

  const charge = typeof CATALOGUE_VERSION !== 'undefined';
  dire();
  dire('=== VERDICT ====================================================');
  if(!version.ok && surLeServeur === false){
    dire("  GitHub Pages n'a pas encore publié la nouvelle version du site.");
    dire('  Rien à faire de ton côté : attends la fin de la publication');
    dire('  (onglet Actions du dépôt), puis recharge.');
  }else if(!charge && surLeServeur){
    dire('  Ton navigateur sert un catalogue.js gardé en cache.');
    dire('  Recharge en forçant : Ctrl+Maj+R (Cmd+Maj+R sur Mac).');
  }else if(!version.ok){
    dire("  Le site fonctionne, mais l'instantané local n'est pas servi :");
    dire('  les données sont demandées en direct aux sources.');
  }else{
    dire("  Tout est en place : instantané servi, catalogue à jour.");
    dire('  Si des cartes restent en anglais, ce sont celles dont la');
    dire("  source n'a pas de version française — la ligne « % reconnus »");
    dire('  ci-dessus le chiffre extension par extension.');
  }
}

document.getElementById('b-physique').addEventListener('click', e => {
  document.querySelectorAll('.onglets button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on'); rapport('physique');
});
document.getElementById('b-pocket').addEventListener('click', e => {
  document.querySelectorAll('.onglets button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on'); rapport('pocket');
});
document.getElementById('copier').addEventListener('click', async (e) => {
  const b = e.target;
  try{ await navigator.clipboard.writeText(sortie.textContent); b.textContent = 'Copié !'; }
  catch(err){
    const r = document.createRange(); r.selectNodeContents(sortie);
    getSelection().removeAllRanges(); getSelection().addRange(r);
    b.textContent = 'Sélectionné — Ctrl+C';
  }
  setTimeout(() => { b.textContent = 'Tout copier'; }, 2500);
});

rapport(universActuel().cle);
</script>
</body>
</html>

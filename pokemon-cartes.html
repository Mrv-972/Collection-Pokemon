<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon — Reliure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.tcgdex.net">
<link rel="preconnect" href="https://assets.tcgdex.net">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --paper:#F1EBDC; --paper-line:#D9CFB6;
    --teal:#1F6F63; --teal-deep:#123F38; --rust:#A8431C; --gold:#C9A227;
    --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(237,234,224,0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a.active{color:var(--text-on-ink)}
  .navlinks a:hover{color:var(--text-on-ink)}
  @media(max-width:720px){.navlinks{display:none}}

  .breadcrumb{padding:24px 0 0;font-size:13px;color:var(--text-on-ink-dim);}
  .breadcrumb a:hover{color:var(--text-on-ink)}

  .page-head{padding:18px 0 30px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;}
  .page-head .sprite{width:84px;height:84px;display:flex;align-items:center;justify-content:center;}
  .page-head .sprite img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
  .page-head h1{font-size:30px;}
  .page-head .meta{color:var(--text-on-ink-dim);font-size:14px;margin-top:6px;}

  .toolbar{display:flex;gap:10px;padding-bottom:30px;flex-wrap:wrap;align-items:center;}
  .toolbar input{flex:1;min-width:180px;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:11px 14px;border-radius:4px;font-size:14px;font-family:inherit;}
  .toolbar input::placeholder{color:var(--text-on-ink-dim)}
  .toolbar select{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:10px 14px;border-radius:4px;font-size:13px;font-family:inherit;}
  .filter-btn{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink-dim);padding:10px 16px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;}
  .filter-btn.on.obt{color:#E3C766;border-color:rgba(201,162,39,0.5);background:rgba(201,162,39,0.1)}
  .filter-btn.on.manq{color:#B9C2CE;border-color:rgba(185,194,206,0.45);background:rgba(185,194,206,0.08)}
  .filter-btn.on.rech{color:#E08862;border-color:rgba(168,67,28,0.5);background:rgba(168,67,28,0.1)}
  .filter-btn.on.ech{color:#5FBAAA;border-color:rgba(31,111,99,0.5);background:rgba(31,111,99,0.12)}

  .bulk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:-14px;padding-bottom:28px;font-size:12.5px;color:var(--text-on-ink-dim);}
  .bulk-btn{font-size:14px;line-height:1.2;padding:4px 12px;border-radius:3px;cursor:pointer;border:1px solid rgba(237,234,224,0.14);background:transparent;font-family:inherit;transition:.12s;}
  .bulk-btn:hover{border-color:rgba(237,234,224,0.35);background:rgba(237,234,224,0.04)}

  .card-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;padding-bottom:60px;}
  @media(max-width:960px){.card-grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:640px){.card-grid{grid-template-columns:repeat(3,1fr)}}

  .card-tile{display:flex;flex-direction:column;gap:8px;}
  .card-img-wrap{position:relative;aspect-ratio:2.5/3.5;border-radius:6px;overflow:hidden;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);display:flex;align-items:center;justify-content:center;}
  .card-img-wrap img{width:100%;height:100%;object-fit:cover;}
  .card-img-wrap .glyph{font-family:'Newsreader',serif;font-style:italic;color:#5A5D63;font-size:44px;line-height:1;}
  .card-num{font-size:11px;color:var(--text-on-ink-dim);display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .card-num span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rarity-symbol{color:var(--gold);letter-spacing:1px;flex-shrink:0;}
  .card-name{font-size:13px;font-weight:500;}

  .tag-row{display:flex;gap:5px;}
  /* Les symboles sont des emojis : leur couleur ne se pilote pas en CSS.
     L'état inactif est donc signalé en les désaturant. */
  .tag-toggle{flex:1;font-size:14px;line-height:1.2;padding:5px 0;border-radius:3px;text-align:center;cursor:pointer;border:1px solid rgba(237,234,224,0.14);background:transparent;font-family:inherit;transition:.12s;}
  .tag-toggle:not(.active){filter:grayscale(1);opacity:.45}
  .tag-toggle.obt.active{background:rgba(201,162,39,0.16);border-color:rgba(201,162,39,0.5)}
  .tag-toggle.rech.active{background:rgba(168,67,28,0.16);border-color:rgba(168,67,28,0.5)}
  .tag-toggle.ech.active{background:rgba(31,111,99,0.18);border-color:rgba(31,111,99,0.5)}
  .tag-toggle:hover{border-color:rgba(237,234,224,0.35);opacity:1}

  .skeleton{aspect-ratio:2.5/3.5;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:6px;position:relative;overflow:hidden;}
  .skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(237,234,224,0.06),transparent);animation:shine 1.4s infinite;}
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .status-msg{color:var(--text-on-ink-dim);font-size:14px;padding:20px 0;}
  .status-msg.err{color:#E08862}
  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(237,234,224,0.08);}
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a class="brand" href="pokecollection-prototype.html">Reli<span>ure</span></a>
    <div class="navlinks">
      <a href="series.html">Extensions</a>
      <a href="pokemon.html" class="active">Pokémon</a>
      <a href="#">Échanges</a>
    </div>
    <a class="brand" style="font-size:14px;font-style:normal" href="#">Mon classeur →</a>
  </nav>

  <div class="breadcrumb"><a href="pokemon.html">← Tous les Pokémon</a></div>

  <div class="page-head" id="page-head">
    <h1>Chargement…</h1>
  </div>

  <div class="toolbar">
    <input type="text" id="filter-input" placeholder="Filtrer par nom de carte ou extension...">
    <select id="rarity-filter"><option value="">Toutes les raretés</option></select>
    <button class="filter-btn obt" id="btn-obt">✅ Obtenues</button>
    <button class="filter-btn manq" id="btn-manq">⬜ Manquantes</button>
    <button class="filter-btn rech" id="btn-rech">❤️ Recherchées</button>
    <button class="filter-btn ech" id="btn-ech">🔁 Échangeables</button>
    <span id="save-status" style="font-size:12px;color:var(--text-on-ink-dim);opacity:0;transition:opacity .3s;">Enregistré ✓</span>
  </div>

  <div class="bulk-row">
    <span>Marquer d'un coup <span id="bulk-count">toutes les cartes</span> :</span>
    <button class="bulk-btn" data-bulk="obt" title="Marquer comme obtenues (recliquer pour tout décocher)">✅</button>
    <button class="bulk-btn" data-bulk="rech" title="Marquer comme recherchées (recliquer pour tout décocher)">❤️</button>
    <button class="bulk-btn" data-bulk="ech" title="Marquer comme échangeables (recliquer pour tout décocher)">🔁</button>
  </div>

  <div id="content">
    <div class="card-grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <footer>Reliure — cartes et images fournies en direct par l'API TCGdex. Tes tags sont enregistrés dans ce navigateur, sur cet appareil.</footer>
</div>

<script src="pokedex-fr.js"></script>
<script src="sets.js"></script>
<script src="tags.js"></script>
<script src="cards.js"></script>
<script>
// Toutes les cartes d'un Pokémon, toutes extensions confondues, à partir de
// son numéro du Pokédex national passé dans l'URL (?dex=25).
const params = new URLSearchParams(window.location.search);
const dexId = Number(params.get('dex')) || 25; // Pikachu par défaut

let allCards = [];
let activeFilter = null; // un des FILTERS, ou null
let setNames = {}; // { [id d'extension]: nom lisible }
let setOrder = {}; // { [id d'extension]: rang chronologique }

// Filtres de la barre d'outils. "manq" n'est pas un tag : c'est l'absence
// du tag "obt", donc rien à cocher sur les cartes.
const FILTERS = ['obt', 'manq', 'rech', 'ech'];

// Bornes officielles du Pokédex national pour chaque génération.
const GENERATIONS = [
  { gen: 1, region: 'Kanto',  from: 1,   to: 151 },
  { gen: 2, region: 'Johto',  from: 152, to: 251 },
  { gen: 3, region: 'Hoenn',  from: 252, to: 386 },
  { gen: 4, region: 'Sinnoh', from: 387, to: 493 },
  { gen: 5, region: 'Unys',   from: 494, to: 649 },
  { gen: 6, region: 'Kalos',  from: 650, to: 721 },
  { gen: 7, region: 'Alola',  from: 722, to: 809 },
  { gen: 8, region: 'Galar',  from: 810, to: 905 },
  { gen: 9, region: 'Paldea', from: 906, to: 1025 },
];

function generationOf(dexId){
  return GENERATIONS.find(g => dexId >= g.from && dexId <= g.to);
}

function renderHead(cardCount){
  const name = POKEDEX_FR[dexId - 1] || `Pokémon n°${dexId}`;
  const generation = generationOf(dexId);
  document.title = `${name} — Reliure`;
  const meta = [
    `N°${String(dexId).padStart(4, '0')}`,
    generation ? `Génération ${generation.gen} — ${generation.region}` : '',
    cardCount === null ? '' : `${cardCount} carte${cardCount > 1 ? 's' : ''}`,
  ].filter(Boolean).join(' · ');

  document.getElementById('page-head').innerHTML = `
    <div class="sprite">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${dexId}.png" alt="${name}" onerror="this.remove()">
    </div>
    <div>
      <h1>${name}</h1>
      <div class="meta">${meta}</div>
    </div>
  `;
}

// Les cartes venant de partout, leur numéro seul ne dit rien : on affiche le
// nom de leur extension. Il se déduit de l'identifiant de la carte, croisé
// avec le catalogue des extensions.
async function loadSetNames(){
  const cacheKey = 'reliure_sets_tcgdex';
  let sets;
  try{
    const cached = sessionStorage.getItem(cacheKey);
    sets = cached ? JSON.parse(cached) : await fetchJson('https://api.tcgdex.net/v2/fr/sets');
  }catch(err){
    console.warn('Impossible de charger le nom des extensions', err);
    return;
  }
  sets.forEach((s, index) => {
    setNames[s.id] = s.name;
    setOrder[s.id] = index;
  });
}

function cardSubtitle(c){
  const setId = setIdOfCard(c.id);
  return `${setNames[setId] || setId} · #${c.localId}`;
}

function renderCards(cards){
  const content = document.getElementById('content');
  if(cards.length === 0){
    content.innerHTML = '<p class="status-msg">Aucune carte ne correspond à ce filtre.</p>';
    return;
  }
  content.innerHTML = `<div class="card-grid">${cards.map(c => cardTile(c, cardSubtitle(c))).join('')}</div>`;
}

function filteredCards(){
  const q = document.getElementById('filter-input').value.trim().toLowerCase();
  const rarity = document.getElementById('rarity-filter').value;
  let filtered = allCards;
  if(q) filtered = filtered.filter(c =>
    c.name.toLowerCase().includes(q) || cardSubtitle(c).toLowerCase().includes(q));
  if(rarity) filtered = filtered.filter(c => c.rarity === rarity);
  if(activeFilter === 'manq') filtered = filtered.filter(c => !tagState[c.id]?.obt);
  else if(activeFilter) filtered = filtered.filter(c => tagState[c.id]?.[activeFilter]);
  return filtered;
}

function applyFilters(){
  const filtered = filteredCards();
  renderCards(filtered);
  const count = filtered.length;
  document.getElementById('bulk-count').textContent =
    count === allCards.length ? `les ${count} cartes` : `les ${count} cartes affichées`;
}

async function loadRarities(){
  const byCardId = await probeRarities(`dexId=eq:${dexId}`, `reliure_rar_dex_${dexId}`, allCards);
  if(!byCardId) return;
  allCards.forEach(c => { c.rarity = byCardId[c.id]; });
  populateRarityFilter(allCards);
  applyFilters();
}

function showSaveStatus(state){
  const el = document.getElementById('save-status');
  if(!el) return;
  if(state === 'saved') el.textContent = 'Enregistré ✓';
  if(state === 'error') el.textContent = "Échec de l'enregistrement";
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1500);
}

async function init(){
  renderHead(null);
  document.getElementById('content').innerHTML = `<div class="card-grid">${Array(12).fill('<div class="skeleton"></div>').join('')}</div>`;

  // Avant le premier rendu, pour que les cartes s'affichent d'emblée avec
  // leurs marques.
  loadTags();

  try{
    const [allResults] = await Promise.all([
      fetchJson(`https://api.tcgdex.net/v2/fr/cards?dexId=eq:${dexId}`),
      loadSetNames(),
    ]);
    // La recherche par numéro de Pokédex ramène aussi les cartes du jeu
    // mobile Pokémon TCG Pocket, hors périmètre pour l'instant.
    const cards = allResults.filter(c => !isPocketSet(setIdOfCard(c.id)));
    // De la carte la plus récente à la plus ancienne.
    cards.sort((a, b) =>
      (setOrder[setIdOfCard(b.id)] ?? -1) - (setOrder[setIdOfCard(a.id)] ?? -1)
      || (a.localId || '').localeCompare(b.localId || '', undefined, { numeric: true }));
    allCards = cards;
    renderHead(cards.length);
    populateRarityFilter(allCards);
    applyFilters();
    // Les raretés arrivent après coup : les cartes restent affichées pendant ce temps.
    loadRarities().catch(err => console.warn('Impossible de charger les raretés', err));
  }catch(err){
    console.warn('Impossible de charger les cartes de ce Pokémon', err);
    document.getElementById('content').innerHTML = `<p class="status-msg err">Impossible de charger les cartes pour le moment.<br><span style="font-size:12px;opacity:.7">${err.message}</span><br><br><button onclick="init()" class="filter-btn" style="margin-top:8px">Réessayer</button></p>`;
  }
}

document.getElementById('content').addEventListener('click', (e) => {
  const btn = e.target.closest('.tag-toggle');
  if(!btn) return;
  toggleTag(btn.dataset.id, btn.dataset.tag);
  applyFilters();
});

document.getElementById('filter-input').addEventListener('input', applyFilters);
document.getElementById('rarity-filter').addEventListener('change', applyFilters);

document.querySelectorAll('.bulk-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    bulkToggleTag(filteredCards(), btn.dataset.bulk);
    applyFilters();
  });
});

// Les filtres s'excluent : en activer un désactive les autres.
FILTERS.forEach(filter => {
  document.getElementById(`btn-${filter}`).addEventListener('click', () => {
    activeFilter = activeFilter === filter ? null : filter;
    FILTERS.forEach(f => {
      document.getElementById(`btn-${f}`).classList.toggle('on', activeFilter === f);
    });
    applyFilters();
  });
});

init();
</script>

</body>
</html>

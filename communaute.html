<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="theme.js?v=2026-10-11-w37z"></script>
<title>Communauté — PokéClasseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --teal:#1F6F63; --teal-deep:#123F38;
    --rust:#A8431C; --gold:#C9A227; --gold-rgb:201,162,39; --accent-clair:#E3C766; --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(var(--trait-rgb),0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a:hover{color:var(--text-on-ink)}

  .panel{max-width:440px;margin:56px auto 80px;}
  .kicker{color:var(--gold);font-size:13px;font-weight:500;margin-bottom:10px;}
  .panel h1{font-size:32px;margin-bottom:10px;}
  .panel p.intro{color:var(--text-on-ink-dim);font-size:15px;margin:0 0 28px;}

  .tabs{display:flex;gap:8px;margin-bottom:24px;}
  .tab{flex:1;background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.12);color:var(--text-on-ink-dim);padding:10px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .tab.on{color:var(--text-on-ink);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.1)}

  label{display:block;font-size:13px;color:var(--text-on-ink-dim);margin:16px 0 6px;}
  input{width:100%;background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.12);color:var(--text-on-ink);padding:11px 14px;border-radius:4px;font-size:14px;font-family:inherit;}
  input:focus{outline:none;border-color:rgba(var(--gold-rgb),0.5)}
  /* La case n'est jamais pré-cochée : un consentement pré-coché n'en est
     pas un, et ne prouve rien. Les liens s'ouvrent dans un nouvel onglet
     pour qu'on ne perde pas ce qu'on vient de saisir. */
  /* Séparée du reste par un trait et par sa couleur : on ne tombe pas sur ce
     bouton en visant « Enregistrer ». */
  .danger-zone{margin-top:40px;padding-top:24px;border-top:1px solid rgba(192,57,43,0.35)}
  .danger-zone h2{font-family:'Newsreader',serif;font-size:18px;font-weight:500;
                  color:var(--alerte);margin:0 0 8px;}
  .danger-zone p{font-size:13px;line-height:1.6;color:var(--text-on-ink-dim);margin:0 0 14px}
  .destructeur{font-family:inherit;font-size:13.5px;padding:10px 18px;border-radius:5px;
               cursor:pointer;background:transparent;color:var(--alerte);
               border:1px solid rgba(192,57,43,0.5);transition:.12s;}
  .destructeur:hover{background:rgba(192,57,43,0.14);color:#F0A088}

  .consentement{display:flex;align-items:flex-start;gap:10px;margin:20px 0 4px;
                font-size:13.5px;line-height:1.55;color:var(--text-on-ink-dim);cursor:pointer;}
  .consentement input{width:19px;height:19px;flex-shrink:0;margin:1px 0 0;accent-color:var(--gold);cursor:pointer}
  .consentement a{color:var(--accent-clair);text-decoration:underline;text-underline-offset:2px}

  .aide{font-size:12px;color:var(--text-on-ink-dim);margin-top:6px;}

  button.principal{width:100%;margin-top:26px;background:var(--teal);border:none;color:#EDF5F3;padding:12px;border-radius:3px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  button.principal:hover{background:var(--teal-deep)}
  button.principal:disabled{opacity:.5;cursor:default}
  button.discret{margin-top:14px;width:100%;background:transparent;border:1px solid rgba(var(--trait-rgb),0.14);color:var(--text-on-ink-dim);padding:10px;border-radius:3px;font-size:13px;cursor:pointer;font-family:inherit;}
  button.discret:hover{border-color:rgba(var(--trait-rgb),0.3)}

  .message{margin-top:20px;font-size:13.5px;padding:12px 14px;border-radius:4px;}
  .message.err{color:var(--alerte);background:rgba(168,67,28,0.1);border:1px solid rgba(168,67,28,0.35)}
  .message.ok{color:var(--succes);background:rgba(31,111,99,0.12);border:1px solid rgba(31,111,99,0.35)}

  .compte-actuel{background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.08);border-radius:5px;padding:22px;}
  .compte-actuel .pseudo{font-family:'Newsreader',serif;font-size:24px;}
  .compte-actuel .detail{color:var(--text-on-ink-dim);font-size:13.5px;margin-top:4px;}
  .bloques{margin-top:30px;border-top:1px solid rgba(var(--trait-rgb),0.08);padding-top:22px;}
  .bloques h2{font-size:19px;margin-bottom:4px;}
  .bloques p{font-size:12.5px;color:var(--text-on-ink-dim);margin:0 0 14px;}
  .bloque{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(var(--trait-rgb),0.06);font-size:14px;}
  .bloque button{background:transparent;border:1px solid rgba(var(--trait-rgb),0.14);color:var(--text-on-ink-dim);padding:5px 12px;border-radius:3px;font-size:12px;cursor:pointer;font-family:inherit;}
  .bloque button:hover{border-color:rgba(var(--trait-rgb),0.35);color:var(--text-on-ink)}

  .zone{margin-top:30px;border-top:1px solid rgba(var(--trait-rgb),0.08);padding-top:22px;}
  .zone h2{font-size:19px;margin-bottom:4px;}
  .zone > p{font-size:12.5px;color:var(--text-on-ink-dim);margin:0 0 14px;}
  .zone-actuelle{background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.08);border-radius:5px;padding:12px 14px;font-size:14px;}
  .zone-actuelle.vide{color:var(--text-on-ink-dim);font-size:13.5px;}
  .recherche{display:flex;gap:8px;align-items:stretch;}
  .recherche input{flex:1}
  .recherche button{background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.12);color:var(--text-on-ink);padding:0 16px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .recherche button:hover{border-color:rgba(var(--gold-rgb),0.5)}
  .recherche button:disabled{opacity:.5;cursor:default}
  .communes{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
  .commune{text-align:left;background:var(--ink-soft);border:1px solid rgba(var(--trait-rgb),0.12);color:var(--text-on-ink);padding:9px 12px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .commune:hover{border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.06)}
  .commune small{display:block;color:var(--text-on-ink-dim);font-size:11.5px;margin-top:1px;}
  .zone-msg{font-size:12.5px;margin-top:10px;}
  .zone-msg.err{color:var(--alerte)}
  .zone-msg.ok{color:var(--succes)}
  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(var(--trait-rgb),0.08);}

  /* ========================= Téléphone =========================
     Les liens de navigation passaient en display:none sous 720 px : depuis
     un téléphone, on ne pouvait plus aller d'une section à l'autre du tout.
     Ils descendent maintenant sur une deuxième ligne de la barre, toujours
     visibles, et assez hauts pour être touchés sans viser. La règle de
     débordement horizontal n'est là que pour les très petits écrans, où
     quatre libellés ne tiennent plus côte à côte.

     Le reste resserre des marges verticales taillées pour un grand écran,
     et porte les commandes à une hauteur tactile confortable — en bas de
     42 px, un doigt touche la voisine une fois sur trois. */
  @media(max-width:720px){
    nav{flex-wrap:wrap;padding:18px 0 0;}
    .navlinks{display:flex;order:3;width:100%;gap:4px;font-size:12.5px;
              justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
    .navlinks::-webkit-scrollbar{display:none}
    .navlinks a{white-space:nowrap;padding:12px 6px;border-bottom:2px solid transparent;}
    .navlinks a.active{border-bottom-color:currentColor;}
    .brand{font-size:19px;padding:6px 0}
    .compte-lien{padding:11px 0 11px 12px}

    .panel{margin:30px auto 60px}
    .panel h1{font-size:26px}
    .tab{min-height:44px}
    input{min-height:44px}
    button.discret{min-height:44px}
    .recherche button{min-height:44px}
    .commune{min-height:44px}
  }
</style>
<style>
  .communaute{max-width:1000px;margin:30px auto 80px}
  .communaute .etat{color:var(--text-on-ink-dim);font-size:14.5px;padding:18px 0;list-style:none}
  .communaute .etat a{color:var(--accent-clair);text-decoration:underline;text-underline-offset:3px}
  .communaute .etat.erreur{color:var(--alerte)}
  .communaute .etat.vide{padding:22px 0}

  /* C'est un <nav> : il ne doit pas hériter de la mise en page de la barre
     principale (étalement, retour à la ligne sur téléphone). */
  .sous-onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 14px;
    justify-content:flex-start;flex-wrap:nowrap;align-items:center;
    border-bottom:1px solid rgba(var(--trait-rgb),0.08);margin-bottom:26px}
  .sous-onglets::-webkit-scrollbar{display:none}
  .sous-onglets a{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:13.5px;padding:8px 14px;
    border-radius:999px;color:var(--text-on-ink-dim);border:1px solid transparent}
  .sous-onglets a:hover{color:var(--text-on-ink);background:rgba(var(--trait-rgb),0.06)}
  .sous-onglets a[aria-current="true"]{color:var(--text-on-ink);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.10)}

  .bouton-principal{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;
    cursor:pointer;border:0;background:var(--teal);color:#EDF5F3;white-space:nowrap;text-decoration:none}
  .bouton-principal:hover{background:var(--teal-deep)}
  .bouton-principal:disabled{opacity:.45;cursor:default}
  .bouton-discret{font:inherit;font-size:13.5px;padding:9px 16px;border-radius:999px;cursor:pointer;
    background:transparent;color:var(--text-on-ink);border:1px solid rgba(var(--trait-rgb),0.18)}
  .bouton-discret:hover{background:rgba(var(--trait-rgb),0.07)}
  .suite{text-align:center;margin:18px 0 0}
  .retour{display:inline-block;font-size:13.5px;color:var(--text-on-ink-dim);margin-bottom:14px}
  .retour:hover{color:var(--text-on-ink)}

  .tete-rubrique{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
  .tete-rubrique h1{font-size:32px;margin-bottom:6px}
  .tete-rubrique p{color:var(--text-on-ink-dim);font-size:14.5px;line-height:1.6;margin:0;max-width:640px}
  .sous-titre{font-size:22px;margin:34px 0 10px}

  .barre-filtres{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:12.5px;padding:6px 12px;border-radius:999px;color:var(--text-on-ink-dim);background:var(--ink-soft);
    border:1px solid rgba(var(--trait-rgb),0.12)}
  .chip:hover{color:var(--text-on-ink)}
  .chip.on{color:var(--text-on-ink);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.12)}

  .liste-sujets{list-style:none;margin:0;padding:0;border-top:1px solid rgba(var(--trait-rgb),0.08)}
  .sujet-ligne{display:flex;gap:16px;padding:16px 4px;border-bottom:1px solid rgba(var(--trait-rgb),0.08)}
  .sujet-ligne.epingle{background:rgba(var(--gold-rgb),0.05)}
  .compteur{flex:none;width:68px;text-align:center;padding:8px 4px;border-radius:10px;font-size:11px;color:var(--text-on-ink-dim);
    border:1px solid rgba(var(--trait-rgb),0.12);align-self:flex-start}
  .compteur b{display:block;font-family:'Newsreader',serif;font-weight:500;font-size:22px;color:var(--text-on-ink);line-height:1.1}
  .compteur.resolue{border-color:rgba(31,111,99,0.6);background:rgba(31,111,99,0.12);color:var(--succes)}
  .compteur.resolue b{color:var(--succes)}
  .compteur.votes.actif{border-color:rgba(var(--gold-rgb),0.55);background:rgba(var(--gold-rgb),0.10)}
  .corps-ligne{flex:1;min-width:0}
  .titre-sujet{font-size:16px;font-weight:500;color:var(--text-on-ink);overflow-wrap:anywhere}
  .titre-sujet:hover{text-decoration:underline;text-underline-offset:3px}
  .etiquettes{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:2px;margin-left:6px}
  .etiquette{font-size:11px;font-weight:500;padding:2px 9px;border-radius:999px;background:rgba(var(--trait-rgb),0.08);color:var(--text-on-ink-dim);white-space:nowrap}
  .etiquette.resolue{background:rgba(31,111,99,0.16);color:var(--succes)}
  .etiquette.nouveau{background:rgba(168,67,28,0.16);color:var(--alerte)}
  .reponse.nouvelle{box-shadow:inset 3px 0 0 var(--alerte);padding-left:14px}
  .reponse.nouvelle .meta .etiquette.nouveau{margin-right:2px}
  .nouvelles-reponses{padding:18px 20px;border-radius:14px;margin-bottom:16px;
    background:rgba(168,67,28,0.06);border:1px solid rgba(168,67,28,0.35)}
  .nouvelles-reponses h2{font-size:19px;margin-bottom:6px}
  .nouvelles-reponses .liste-mini{margin:0}
  .nouvelles-reponses small .etiquette{vertical-align:0;margin-right:2px}
  .etiquette.statut.etudiee{background:rgba(var(--gold-rgb),0.14);color:var(--accent-clair)}
  .etiquette.statut.prevue{background:rgba(60,110,200,0.16);color:#7FA8E8}
  html[data-theme="clair"] .etiquette.statut.prevue{color:#1E4E9A}
  .etiquette.statut.faite{background:rgba(31,111,99,0.16);color:var(--succes)}
  .etiquette.statut.refusee{background:rgba(168,67,28,0.14);color:var(--alerte)}
  .extrait{margin:5px 0 6px;font-size:13.5px;line-height:1.5;color:var(--text-on-ink-dim);overflow-wrap:anywhere}
  .meta{font-size:12.5px;color:var(--text-on-ink-dim);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .auteur{display:inline-flex;align-items:center;gap:6px;color:var(--text-on-ink);font-weight:500}
  .auteur.ancien{color:var(--text-on-ink-dim);font-weight:400;font-style:italic}

  .categories{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin:6px 0 0}
  .categorie{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:14px;color:var(--text-on-ink);
    background:rgba(var(--trait-rgb),0.04);border:1px solid rgba(var(--trait-rgb),0.10)}
  .categorie:hover{border-color:rgba(var(--gold-rgb),0.5)}
  .categorie .icone{font-size:26px;line-height:1}
  .categorie b{display:block;font-size:15px}
  .categorie small{display:block;font-size:12.5px;color:var(--text-on-ink-dim);line-height:1.5;margin-top:2px}
  .categorie .compte{display:block;font-style:normal;font-size:11.5px;color:var(--text-on-ink-dim);margin-top:6px}

  .sujet-complet{padding:24px;border-radius:16px;background:rgba(var(--trait-rgb),0.04);border:1px solid rgba(var(--trait-rgb),0.10)}
  .sujet-complet .etiquettes{margin:0 0 10px}
  .sujet-complet h1{font-size:30px;line-height:1.2;margin-bottom:10px;overflow-wrap:anywhere}
  .texte{font-size:15px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;margin:16px 0 0}
  .texte a{color:var(--accent-clair);text-decoration:underline;text-underline-offset:2px}
  .actions-message{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .petit,.vote{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;background:transparent;
    color:var(--text-on-ink);border:1px solid rgba(var(--trait-rgb),0.18)}
  .petit:hover,.vote:hover{background:rgba(var(--trait-rgb),0.07)}
  .petit.leger{border-color:transparent;color:var(--text-on-ink-dim)}
  .petit.danger:hover{color:var(--alerte);border-color:rgba(168,67,28,0.5)}
  .petit.actif,.vote.actif{border-color:rgba(var(--gold-rgb),0.6);background:rgba(var(--gold-rgb),0.12)}
  .vote{font-size:13.5px;padding:8px 14px}
  .vote b{margin-left:6px}
  .moderation{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(var(--gold-rgb),0.4)}
  .insigne-admin{font-size:12px;font-weight:600;color:var(--accent-clair)}
  .statut-choix{font-size:12.5px;color:var(--text-on-ink-dim);display:inline-flex;align-items:center;gap:6px}
  .statut-choix select{font:inherit;font-size:12.5px;padding:5px 8px;border-radius:8px;background:var(--ink);color:var(--text-on-ink);border:1px solid rgba(var(--trait-rgb),0.18)}

  .bloc-reponses h2{font-size:22px;margin:30px 0 8px}
  .reponse{padding:16px 0;border-top:1px solid rgba(var(--trait-rgb),0.08)}
  .reponse .texte{margin-top:8px;font-size:14.5px}
  .reponse.acceptee{padding:16px;border-radius:14px;border:1px solid rgba(31,111,99,0.55);background:rgba(31,111,99,0.08);margin-bottom:8px}
  .mention-acceptee{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--succes)}
  .repondre{margin-top:26px;padding-top:20px;border-top:1px solid rgba(var(--trait-rgb),0.10)}
  .libelle{display:block;font-size:13px;color:var(--text-on-ink-dim);margin:0 0 6px}
  .communaute textarea,.fenetre-communaute textarea,.champ{width:100%;box-sizing:border-box;font:inherit;font-size:14.5px;
    padding:11px 13px;border-radius:10px;background:var(--ink);color:var(--text-on-ink);border:1px solid rgba(var(--trait-rgb),0.16)}
  .communaute textarea{resize:vertical;line-height:1.55}
  .communaute textarea:focus,.champ:focus{outline:none;border-color:rgba(var(--gold-rgb),0.6)}
  .fenetre-communaute .champ{margin-bottom:14px}
  .fenetre-communaute .libelle{margin-top:2px}
  .ligne-envoi{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:10px}
  .compteur-texte{font-size:12px;color:var(--text-on-ink-dim);margin:6px 0 0}
  .edition{margin-top:14px;display:flex;flex-direction:column;gap:10px}

  .bienvenue{padding:26px;border-radius:18px;margin-bottom:18px;
    background:linear-gradient(135deg, rgba(var(--gold-rgb),0.14), rgba(var(--trait-rgb),0.03));border:1px solid rgba(var(--gold-rgb),0.3)}
  .bienvenue h1{font-size:34px;margin-bottom:8px}
  .bienvenue p{color:var(--text-on-ink-dim);font-size:15px;line-height:1.6;max-width:680px;margin:0 0 16px}
  .bienvenue p:last-child{margin:0}
  .bienvenue .badges-annonce{font-size:13.5px}
  .bienvenue .badges-annonce a{color:var(--accent-clair);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .accueil-grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:18px;align-items:start}
  .bloc-accueil{padding:18px 20px;border-radius:14px;background:rgba(var(--trait-rgb),0.04);border:1px solid rgba(var(--trait-rgb),0.10)}
  .bloc-accueil h2{font-size:19px;margin-bottom:8px}
  .bloc-accueil h2 a:hover{text-decoration:underline;text-underline-offset:3px}
  .liste-mini{list-style:none;margin:0 0 10px;padding:0}
  .liste-mini li{padding:8px 0;border-bottom:1px solid rgba(var(--trait-rgb),0.07);font-size:14px}
  .liste-mini li:last-child{border-bottom:0}
  .liste-mini a{color:var(--text-on-ink);overflow-wrap:anywhere}

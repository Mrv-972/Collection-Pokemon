<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Par extension — PokéClasseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.tcgdex.net">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://raw.githubusercontent.com">
<link rel="preconnect" href="https://assets.tcgdex.net">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --paper:#F1EBDC; --paper-line:#D9CFB6;
    --teal:#1F6F63; --teal-deep:#123F38; --rust:#A8431C; --gold:#C9A227; --gold-rgb:201,162,39; --accent-clair:var(--accent-clair);
    --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2,h3{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(237,234,224,0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a.active{color:var(--text-on-ink)}
  .navlinks a:hover{color:var(--text-on-ink)}

  .page-head{padding:56px 0 36px;}
  .kicker{color:var(--gold);font-size:13px;font-weight:500;margin-bottom:10px;}
  .page-head h1{font-size:40px;}
  .page-head p{color:var(--text-on-ink-dim);margin-top:14px;font-size:16px;max-width:60ch;}

  .search-row{display:flex;gap:10px;padding-bottom:40px;}
  .search-row input{flex:1;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:12px 14px;border-radius:4px;font-size:14px;font-family:inherit;}
  .search-row input::placeholder{color:var(--text-on-ink-dim)}

  .series-block{padding:34px 0;border-top:1px solid rgba(237,234,224,0.08);}
  .series-title{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;}
  .series-title h2{font-size:22px;}
  .series-title .count{font-size:13px;color:var(--text-on-ink-dim);}

  .set-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
  @media(max-width:900px){.set-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(max-width:640px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .set-card{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:5px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}
  .set-card:hover{border-color:rgba(237,234,224,0.25)}
  .set-logo{height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .set-logo .logo{min-width:0;max-width:100%;max-height:100%;object-fit:contain;object-position:left center;}
  .set-logo .symbol{height:20px;width:20px;flex-shrink:0;object-fit:contain;opacity:.85;}
  .set-logo .glyph{font-family:'Newsreader',serif;font-style:italic;color:#5A5D63;font-size:28px;line-height:1;}
  .set-name{font-size:14.5px;font-weight:500;line-height:1.3;}
  .set-meta{font-size:12px;color:var(--text-on-ink-dim);display:flex;justify-content:space-between;margin-top:auto;}
  .set-meta .tag-count{color:var(--teal);font-weight:500}

  .skeleton{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:5px;height:118px;position:relative;overflow:hidden;}
  .skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(237,234,224,0.06),transparent);animation:shine 1.4s infinite;}
  @keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .status-msg{color:var(--text-on-ink-dim);font-size:14px;padding:20px 0;}
  .status-msg.err{color:#E08862}

  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(237,234,224,0.08);}

  /* ========================= Téléphone =========================
     Les liens de navigation passaient en display:none sous 720 px : depuis
     un téléphone, on ne pouvait plus aller d'une section à l'autre du tout.
     Ils descendent maintenant sur une deuxième ligne de la barre, toujours
     visibles, et assez hauts pour être touchés sans viser. La règle de
     débordement horizontal n'est là que pour les très petits écrans, où
     quatre libellés ne tiennent plus côte à côte.

     Le reste resserre des marges verticales taillées pour un grand écran,
     et porte les commandes à une hauteur tactile confortable — en bas de
     42 px, un doigt touche la voisine une fois sur trois. */
  @media(max-width:720px){
    nav{flex-wrap:wrap;padding:18px 0 0;}
    .navlinks{display:flex;order:3;width:100%;gap:4px;font-size:12.5px;
              justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
    .navlinks::-webkit-scrollbar{display:none}
    .navlinks a{white-space:nowrap;padding:12px 6px;border-bottom:2px solid transparent;}
    .navlinks a.active{border-bottom-color:currentColor;}
    .brand{font-size:19px;padding:6px 0}
    .compte-lien{padding:11px 0 11px 12px}

    .page-head{padding:30px 0 24px}
    .page-head h1{font-size:27px}
    .page-head p{font-size:14.5px}
    .search-row input{min-height:44px}
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a class="brand" href="index.html">Poké<span>Classeur</span></a>
    <div class="navlinks">
      <a href="#" class="active">Par extension</a>
      <a href="pokemon.html">Par Pokémon</a>
      <a href="echanges.html">Échanges</a>
      <a href="discussions.html">Discussions</a>
    </div>
    <a class="brand compte-lien" style="font-size:14px;font-style:normal" href="connexion.html">Se connecter →</a>
  </nav>

  <div class="page-head">
    <div class="kicker" id="tete-kicker">Catalogue</div>
    <h1 id="tete-titre">Toutes les séries, toutes les extensions</h1>
    <p id="tete-intro"></p>
  </div>

  <div class="search-row">
    <input type="text" id="filter-input" placeholder="Filtrer par nom d'extension...">
  </div>

  <div id="content">
    <div class="set-grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </div>

  <footer>PokéClasseur — données d'extensions fournies en direct par l'API TCGdex. Projet non affilié à The Pokémon Company.</footer>
</div>

<script src="univers.js?v=2026-09-20-vae4"></script>
<script src="catalogue.js?v=2026-09-20-vae4"></script>
<script src="supabase-config.js?v=2026-09-20-vae4"></script>
<script src="admin.js?v=2026-09-20-vae4"></script>
<script src="compte.js?v=2026-09-20-vae4"></script>
<script src="sets.js?v=2026-09-20-vae4"></script>
<script>
// Récupère la liste complète des extensions depuis l'API publique et gratuite
// TCGdex (aucune clé requise), puis les regroupe par série (Écarlate et
// Violet, Épée et Bouclier, etc.). Les logos affichés sont hébergés par
// TCGdex, rien n'est stocké ici.
let allSets = [];

async function fetchJson(url, retries = 1){
  const res = await fetch(url);
  const text = await res.text();
  if(!res.ok || !text){
    if(retries > 0){
      await new Promise(r => setTimeout(r, 1200));
      return fetchJson(url, retries - 1);
    }
    throw new Error(`Réponse vide ou erreur HTTP ${res.status}.`);
  }
  return JSON.parse(text);
}

// La présentation dépend de l'univers : parler des grandes séries du jeu
// physique n'a aucun sens devant le catalogue de l'application.
const PRESENTATION = {
  physique: {
    kicker: 'Catalogue · TCG physique',
    titre: 'Toutes les séries, toutes les extensions',
    intro: "Le jeu de cartes Pokémon est découpé en grandes séries (Écarlate et Violet, Épée et Bouclier, Soleil et Lune...), chacune contenant plusieurs extensions. Choisis une extension pour voir son classeur.",
  },
  pocket: {
    kicker: 'Catalogue · TCG Pocket',
    titre: "Toutes les extensions de l'application",
    intro: "Pokémon TCG Pocket sort ses propres extensions, qui n'existent que dans l'application. Choisis-en une pour voir son classeur — tes cartes physiques restent rangées de l'autre côté.",
  },
};

function rendreTete(){
  const t = PRESENTATION[universActuel().cle];
  document.getElementById('tete-kicker').textContent = t.kicker;
  document.getElementById('tete-titre').textContent = t.titre;
  document.getElementById('tete-intro').textContent = t.intro;
}
rendreTete();

async function loadSets(){
  const content = document.getElementById('content');

  try{
    const sets = await listerExtensions();
    // Chaque univers son catalogue : les extensions de l'application mobile
    // et celles du jeu de cartes physique ne se mélangent pas. Le filtre se
    // fait ici, jamais dans le cache : celui-ci porte le catalogue entier,
    // que trois autres pages relisent pour y trouver un nom d'extension.
    const duCote = sets.filter(s => appartientAUnivers(s.id));
    // L'API renvoie les extensions de la plus ancienne à la plus récente ;
    // on inverse pour afficher les plus récentes en premier.
    allSets = duCote.slice().reverse();
    renderSets(allSets);
  }catch(err){
    console.warn('Impossible de charger les extensions', err);
    content.innerHTML = `<p class="status-msg err">Impossible de charger le catalogue pour le moment.<br><span style="font-size:12px;opacity:.7">${err.message}</span><br><br><button onclick="loadSets()" class="filter-btn" style="margin-top:8px">Réessayer</button></p>`;
  }
}

// L'API range les sigles sous un segment "univ", mais les fichiers ne s'y
// trouvent que pour les extensions les plus récentes : partout ailleurs ils
// sont rangés par langue. On tente donc la version française, puis l'adresse
// telle que fournie. Un sigle absent disparaît sans laisser de trou,
// contrairement au logo qui, lui, est signalé.
function symbolFallback(img){
  const fallback = img.dataset.fallback;
  if(fallback){
    img.removeAttribute('data-fallback');
    img.src = fallback;
    return;
  }
  img.remove();
}

// Quand TCGdex n'a pas le logo français d'une extension, on retombe sur une
// image ajoutée à la main dans le dépôt (images/sets/<id de l'extension>.png).
function setLogoFallback(img){
  const fallback = img.dataset.fallback;
  if(fallback){
    img.removeAttribute('data-fallback');
    img.src = fallback;
    return;
  }
  img.replaceWith(Object.assign(document.createElement('span'), { className: 'glyph', textContent: '?', title: 'Logo non disponible' }));
}

function groupBySeries(sets){
  const groups = {};
  const order = [];
  sets.forEach(s => {
    // Le catalogue livre déjà chaque extension avec sa série.
    const seriesName = s.serieNom;
    if(!groups[seriesName]){ groups[seriesName] = []; order.push(seriesName); }
    groups[seriesName].push(s);
  });
  return { groups, order };
}

function renderSets(sets){
  const content = document.getElementById('content');
  if(sets.length === 0){
    content.innerHTML = '<p class="status-msg">Aucune extension ne correspond à ta recherche.</p>';
    return;
  }
  const { groups, order } = groupBySeries(sets);
  content.innerHTML = order.map(seriesName => {
    const setsInSeries = groups[seriesName];
    const cards = setsInSeries.map(s => {
      const year = s.releaseDate ? new Date(s.releaseDate).getFullYear() : '';
      // Toutes les sources ne comptent pas les cartes d'une extension de
      // promotion : mieux vaut ne rien annoncer qu'un point d'interrogation.
      const total = s.cardCount?.official ?? s.cardCount?.total ?? null;
      return `
      <a class="set-card" href="extension.html?set=${s.id}">
        <div class="set-logo">
          ${s.logo
            ? `<img class="logo" src="${s.logo}" alt="${s.name}" loading="lazy" data-fallback="images/sets/${s.id}.png" onerror="setLogoFallback(this)">`
            : `<img class="logo" src="images/sets/${s.id}.png" alt="${s.name}" loading="lazy" onerror="setLogoFallback(this)">`}
          ${s.symbol
            ? `<img class="symbol" src="${s.symbol}" alt="Symbole de ${s.name}" title="Symbole de l'extension" loading="lazy" onerror="symbolFallback(this)">`
            : ''}
        </div>
        <div class="set-name">${s.name}</div>
        <div class="set-meta">
          <span>${year}</span>
          <span class="tag-count">${total ? total + ' cartes' : ''}</span>
        </div>
      </a>
    `;
    }).join('');
    return `
      <div class="series-block">
        <div class="series-title">
          <h2>${seriesName}</h2>
          <span class="count">${setsInSeries.length} extension${setsInSeries.length > 1 ? 's' : ''}</span>
        </div>
        <div class="set-grid">${cards}</div>
      </div>
    `;
  }).join('');
}

document.getElementById('filter-input').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if(!q){ renderSets(allSets); return; }
  renderSets(allSets.filter(s => s.name.toLowerCase().includes(q)));
});

loadSets();

initCompte().then(afficherEtatCompte);
</script>

</body>
</html>

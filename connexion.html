<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — PokéClasseur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15171B; --ink-soft:#20232A; --teal:#1F6F63; --teal-deep:#123F38;
    --rust:#A8431C; --gold:#C9A227; --gold-rgb:201,162,39; --accent-clair:var(--accent-clair); --text-on-ink:#EDEAE0; --text-on-ink-dim:#9B9E9C;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text-on-ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;}
  h1,h2{font-family:'Newsreader',serif;font-weight:500;margin:0;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1080px;margin:0 auto;padding:0 32px;}
  @media(max-width:640px){.wrap{padding:0 20px}}

  nav{display:flex;align-items:center;justify-content:space-between;padding:28px 0;border-bottom:1px solid rgba(237,234,224,0.08);}
  .brand{font-family:'Newsreader',serif;font-style:italic;font-size:22px;}
  .brand span{color:var(--gold)}
  .navlinks{display:flex;gap:32px;font-size:14px;color:var(--text-on-ink-dim)}
  .navlinks a:hover{color:var(--text-on-ink)}

  .panel{max-width:440px;margin:56px auto 80px;}
  .kicker{color:var(--gold);font-size:13px;font-weight:500;margin-bottom:10px;}
  .panel h1{font-size:32px;margin-bottom:10px;}
  .panel p.intro{color:var(--text-on-ink-dim);font-size:15px;margin:0 0 28px;}

  .tabs{display:flex;gap:8px;margin-bottom:24px;}
  .tab{flex:1;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink-dim);padding:10px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .tab.on{color:var(--text-on-ink);border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.1)}

  label{display:block;font-size:13px;color:var(--text-on-ink-dim);margin:16px 0 6px;}
  input{width:100%;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:11px 14px;border-radius:4px;font-size:14px;font-family:inherit;}
  input:focus{outline:none;border-color:rgba(var(--gold-rgb),0.5)}
  .aide{font-size:12px;color:var(--text-on-ink-dim);margin-top:6px;}

  button.principal{width:100%;margin-top:26px;background:var(--teal);border:none;color:#EDF5F3;padding:12px;border-radius:3px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  button.principal:hover{background:var(--teal-deep)}
  button.principal:disabled{opacity:.5;cursor:default}
  button.discret{margin-top:14px;width:100%;background:transparent;border:1px solid rgba(237,234,224,0.14);color:var(--text-on-ink-dim);padding:10px;border-radius:3px;font-size:13px;cursor:pointer;font-family:inherit;}
  button.discret:hover{border-color:rgba(237,234,224,0.3)}

  .message{margin-top:20px;font-size:13.5px;padding:12px 14px;border-radius:4px;}
  .message.err{color:#E08862;background:rgba(168,67,28,0.1);border:1px solid rgba(168,67,28,0.35)}
  .message.ok{color:#5FBAAA;background:rgba(31,111,99,0.12);border:1px solid rgba(31,111,99,0.35)}

  .compte-actuel{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:5px;padding:22px;}
  .compte-actuel .pseudo{font-family:'Newsreader',serif;font-size:24px;}
  .compte-actuel .detail{color:var(--text-on-ink-dim);font-size:13.5px;margin-top:4px;}
  .bloques{margin-top:30px;border-top:1px solid rgba(237,234,224,0.08);padding-top:22px;}
  .bloques h2{font-size:19px;margin-bottom:4px;}
  .bloques p{font-size:12.5px;color:var(--text-on-ink-dim);margin:0 0 14px;}
  .bloque{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(237,234,224,0.06);font-size:14px;}
  .bloque button{background:transparent;border:1px solid rgba(237,234,224,0.14);color:var(--text-on-ink-dim);padding:5px 12px;border-radius:3px;font-size:12px;cursor:pointer;font-family:inherit;}
  .bloque button:hover{border-color:rgba(237,234,224,0.35);color:var(--text-on-ink)}

  .zone{margin-top:30px;border-top:1px solid rgba(237,234,224,0.08);padding-top:22px;}
  .zone h2{font-size:19px;margin-bottom:4px;}
  .zone > p{font-size:12.5px;color:var(--text-on-ink-dim);margin:0 0 14px;}
  .zone-actuelle{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.08);border-radius:5px;padding:12px 14px;font-size:14px;}
  .zone-actuelle.vide{color:var(--text-on-ink-dim);font-size:13.5px;}
  .recherche{display:flex;gap:8px;align-items:stretch;}
  .recherche input{flex:1}
  .recherche button{background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:0 16px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .recherche button:hover{border-color:rgba(var(--gold-rgb),0.5)}
  .recherche button:disabled{opacity:.5;cursor:default}
  .communes{margin-top:10px;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;}
  .commune{text-align:left;background:var(--ink-soft);border:1px solid rgba(237,234,224,0.12);color:var(--text-on-ink);padding:9px 12px;border-radius:4px;font-size:13.5px;cursor:pointer;font-family:inherit;}
  .commune:hover{border-color:rgba(var(--gold-rgb),0.5);background:rgba(var(--gold-rgb),0.06)}
  .commune small{display:block;color:var(--text-on-ink-dim);font-size:11.5px;margin-top:1px;}
  .zone-msg{font-size:12.5px;margin-top:10px;}
  .zone-msg.err{color:#E08862}
  .zone-msg.ok{color:#5FBAAA}
  footer{padding:44px 0;color:var(--text-on-ink-dim);font-size:13px;border-top:1px solid rgba(237,234,224,0.08);}

  /* ========================= Téléphone =========================
     Les liens de navigation passaient en display:none sous 720 px : depuis
     un téléphone, on ne pouvait plus aller d'une section à l'autre du tout.
     Ils descendent maintenant sur une deuxième ligne de la barre, toujours
     visibles, et assez hauts pour être touchés sans viser. La règle de
     débordement horizontal n'est là que pour les très petits écrans, où
     quatre libellés ne tiennent plus côte à côte.

     Le reste resserre des marges verticales taillées pour un grand écran,
     et porte les commandes à une hauteur tactile confortable — en bas de
     42 px, un doigt touche la voisine une fois sur trois. */
  @media(max-width:720px){
    nav{flex-wrap:wrap;padding:18px 0 0;}
    .navlinks{display:flex;order:3;width:100%;gap:4px;font-size:12.5px;
              justify-content:space-between;overflow-x:auto;scrollbar-width:none;}
    .navlinks::-webkit-scrollbar{display:none}
    .navlinks a{white-space:nowrap;padding:12px 6px;border-bottom:2px solid transparent;}
    .navlinks a.active{border-bottom-color:currentColor;}
    .brand{font-size:19px;padding:6px 0}
    .compte-lien{padding:11px 0 11px 12px}

    .panel{margin:30px auto 60px}
    .panel h1{font-size:26px}
    .tab{min-height:44px}
    input{min-height:44px}
    button.discret{min-height:44px}
    .recherche button{min-height:44px}
    .commune{min-height:44px}
  }
</style>
</head>
<body>

<div class="wrap">
  <nav>
    <a class="brand" href="index.html">Poké<span>Classeur</span></a>
    <div class="navlinks">
      <a href="series.html">Par extension</a>
      <a href="pokemon.html">Par Pokémon</a>
      <a href="missions.html" class="lien-pocket">Missions secrètes</a>
      <a href="echanges.html">Échanges</a>
      <a href="discussions.html">Discussions</a>
    </div>
    <a class="brand compte-lien" style="font-size:14px;font-style:normal" href="connexion.html">Se connecter →</a>
  </nav>

  <div class="panel" id="panel">
    <p class="intro">Chargement…</p>
  </div>

  <footer data-note="Ton compte sert à retrouver ta collection sur tous tes appareils et à te mettre en relation avec d'autres collectionneurs."></footer>
</div>

<script src="univers.js?v=2026-09-21-p6m4"></script>
<script src="supabase-config.js?v=2026-09-21-p6m4"></script>
<script src="pied.js?v=2026-09-21-p6m4"></script>
<script src="admin.js?v=2026-09-21-p6m4"></script>
<script src="tags.js?v=2026-09-21-p6m4"></script>
<script src="localisation.js?v=2026-09-21-p6m4"></script>
<script src="compte.js?v=2026-09-21-p6m4"></script>
<script src="messagerie.js?v=2026-09-21-p6m4"></script>
<script>
let ongletActif = 'connexion';
let motDePasseOublie = false;

function afficherMessage(texte, type){
  const el = document.getElementById('message');
  if(!el) return;
  el.className = `message ${type}`;
  el.textContent = texte;
}

function rendre(){
  const panel = document.getElementById('panel');

  if(CONFIG_MANQUANTE){
    panel.innerHTML = `
      <div class="kicker">Compte</div>
      <h1>Base de données à configurer</h1>
      <p class="intro">Les comptes ont besoin d'une base en ligne. Renseigne l'adresse et la clé publique de ton projet Supabase dans le fichier <code>supabase-config.js</code>, puis recharge cette page.</p>
    `;
    return;
  }

  // Arrivée depuis un lien de réinitialisation : la session ouverte ne sert
  // qu'à cela, on ne montre donc rien d'autre.
  if(enRecuperation()){
    panel.innerHTML = `
      <div class="kicker">Compte</div>
      <h1>Nouveau mot de passe</h1>
      <p class="intro">Choisis un nouveau mot de passe. Tu seras connecté dans la foulée.</p>

      <label for="mdp">Nouveau mot de passe</label>
      <input id="mdp" type="password" autocomplete="new-password">
      <div class="aide">Au moins ${LONGUEUR_MOT_DE_PASSE} caractères.</div>

      <button class="principal" id="btn-nouveau-mdp">Enregistrer</button>
      <div id="message"></div>
    `;
    document.getElementById('btn-nouveau-mdp').addEventListener('click', enregistrerNouveauMotDePasse);
    document.getElementById('mdp').focus();
    return;
  }

  // Connecté mais sans profil : il reste à choisir un pseudo, ce qui arrive
  // quand l'inscription est passée par une confirmation d'e-mail.
  if(profilAcreer()){
    const attendu = pseudoEnAttente() ?? {};
    panel.innerHTML = `
      <div class="kicker">Compte</div>
      <h1>Choisis ton pseudo</h1>
      <p class="intro">Dernière étape : c'est le nom que verront les autres collectionneurs.</p>

      <label for="pseudo">Pseudo</label>
      <input id="pseudo" type="text" value="${attendu.pseudo ?? ''}">

      <label for="naissance">Date de naissance</label>
      <input id="naissance" type="date" value="${attendu.ne_le ?? ''}">
      <div class="aide">Il faut avoir au moins ${AGE_MINIMUM} ans. Cette date n'est jamais montrée aux autres membres.</div>

      <label for="contact">Comment te joindre (facultatif)</label>
      <input id="contact" type="text" value="${attendu.contact ?? ''}" placeholder="Pseudo Discord, e-mail...">
      <div class="aide">Affiché uniquement aux membres avec qui un échange est possible.</div>

      <button class="principal" id="btn-creer-profil">Terminer</button>
      <button class="discret" id="btn-deconnexion">Se déconnecter</button>
      <div id="message"></div>
    `;
    document.getElementById('btn-creer-profil').addEventListener('click', terminerProfil);
    document.getElementById('btn-deconnexion').addEventListener('click', deconnexion);
    return;
  }

  if(estConnecte()){
    panel.innerHTML = `
      <div class="kicker">Compte</div>
      <h1>Mon compte</h1>
      <div class="compte-actuel">
        <div class="pseudo">${profil?.pseudo ?? 'Membre'}</div>
        <div class="detail">${membre.email}</div>
        <div class="detail">${profil?.contact ? 'Contact partagé : ' + profil.contact : 'Aucun moyen de contact renseigné'}</div>
      </div>

      <label for="pseudo">Pseudo</label>
      <input id="pseudo" type="text" value="${profil?.pseudo ?? ''}">

      <label for="naissance">Date de naissance</label>
      <input id="naissance" type="date" value="${profil?.ne_le ?? ''}">
      <div class="aide">Il faut avoir au moins ${AGE_MINIMUM} ans. Cette date n'est jamais montrée aux autres membres.</div>

      <label for="contact">Comment te joindre</label>
      <input id="contact" type="text" value="${profil?.contact ?? ''}" placeholder="Pseudo Discord, e-mail...">
      <div class="aide">Affiché uniquement aux membres avec qui un échange est possible.</div>

      <button class="principal" id="btn-maj">Enregistrer</button>
      <button class="discret" id="btn-deconnexion">Se déconnecter</button>
      <div id="message"></div>

      <div class="zone" id="zone"></div>
      <div class="bloques" id="bloques"></div>
    `;
    afficherZone();
    afficherBloques();
    document.getElementById('btn-maj').addEventListener('click', enregistrerProfil);
    document.getElementById('btn-deconnexion').addEventListener('click', deconnexion);
    return;
  }

  if(motDePasseOublie){
    panel.innerHTML = `
      <div class="kicker">Compte</div>
      <h1>Mot de passe oublié</h1>
      <p class="intro">Indique ton adresse e-mail : tu recevras un lien pour en choisir un nouveau.</p>

      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email">

      <button class="principal" id="btn-lien">Envoyer le lien</button>
      <button class="discret" id="btn-retour">Revenir à la connexion</button>
      <div id="message"></div>
    `;
    document.getElementById('btn-lien').addEventListener('click', demanderLien);
    document.getElementById('btn-retour').addEventListener('click', () => { motDePasseOublie = false; rendre(); });
    document.getElementById('email').focus();
    return;
  }

  const inscription = ongletActif === 'inscription';
  panel.innerHTML = `
    <div class="kicker">Compte</div>
    <h1>${inscription ? 'Créer un compte' : 'Se connecter'}</h1>
    <p class="intro">${inscription
      ? 'Ton classeur te suivra sur tous tes appareils, et les autres collectionneurs pourront te proposer des échanges.'
      : 'Retrouve ta collection et tes échanges possibles.'}</p>

    <div class="tabs">
      <button class="tab ${inscription ? '' : 'on'}" data-onglet="connexion">Se connecter</button>
      <button class="tab ${inscription ? 'on' : ''}" data-onglet="inscription">Créer un compte</button>
    </div>

    <label for="email">Adresse e-mail</label>
    <input id="email" type="email" autocomplete="email">

    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="${inscription ? 'new-password' : 'current-password'}">

    ${inscription ? `
      <label for="pseudo">Pseudo</label>
      <input id="pseudo" type="text" placeholder="Le nom que verront les autres collectionneurs">

      <label for="naissance">Date de naissance</label>
      <input id="naissance" type="date">
      <div class="aide">Il faut avoir au moins ${AGE_MINIMUM} ans pour s'inscrire. Cette date n'est jamais montrée aux autres membres.</div>

      <label for="contact">Comment te joindre (facultatif)</label>
      <input id="contact" type="text" placeholder="Pseudo Discord, e-mail...">
      <div class="aide">Affiché uniquement aux membres avec qui un échange est possible. Tu pourras le renseigner plus tard.</div>
    ` : ''}

    <button class="principal" id="btn-valider">${inscription ? 'Créer mon compte' : 'Se connecter'}</button>
    ${inscription ? '' : '<button class="discret" id="btn-oubli">Mot de passe oublié ?</button>'}
    <div id="message"></div>
  `;

  document.getElementById('btn-oubli')?.addEventListener('click', () => { motDePasseOublie = true; rendre(); });

  panel.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => { ongletActif = t.dataset.onglet; rendre(); });
  });
  document.getElementById('btn-valider').addEventListener('click', valider);
}

async function valider(){
  const bouton = document.getElementById('btn-valider');
  const email = document.getElementById('email').value.trim();
  const mdp = document.getElementById('mdp').value;
  const inscription = ongletActif === 'inscription';

  if(!email || !mdp){
    afficherMessage('Renseigne ton adresse e-mail et ton mot de passe.', 'err');
    return;
  }
  const pseudo = inscription ? document.getElementById('pseudo').value.trim() : '';
  if(inscription && !pseudo){
    afficherMessage('Choisis un pseudo : c\'est ce que verront les autres collectionneurs.', 'err');
    return;
  }

  bouton.disabled = true;
  bouton.textContent = 'Un instant…';
  try{
    if(inscription){
      await sInscrire(email, mdp, pseudo, document.getElementById('contact').value, document.getElementById('naissance').value);
    }else{
      await seConnecter(email, mdp);
    }
    afficherEtatCompte();
    rendre();
    afficherMessage('Te voilà connecté. Ta collection est désormais enregistrée en ligne.', 'ok');
  }catch(err){
    console.warn(err);
    bouton.disabled = false;
    bouton.textContent = inscription ? 'Créer mon compte' : 'Se connecter';
    afficherMessage(messageLisible(err), 'err');
  }
}

// Les messages de Supabase sont en anglais et techniques : on traduit les cas
// courants, et on garde le message d'origine pour les autres.
function messageLisible(err){
  const texte = err?.message ?? String(err);
  if(/Invalid login credentials/i.test(texte)) return 'Adresse e-mail ou mot de passe incorrect.';
  if(/User already registered/i.test(texte)) return 'Un compte existe déjà avec cette adresse e-mail.';
  if(/Password should be at least/i.test(texte)) return 'Le mot de passe doit faire au moins 6 caractères.';
  if(/Unable to validate email/i.test(texte) || /invalid format/i.test(texte)) return "L'adresse e-mail ne semble pas valide.";
  if(/Email not confirmed/i.test(texte)) return "Ton adresse e-mail n'a pas encore été confirmée : regarde tes e-mails.";
  if(/New password should be different/i.test(texte)) return "Choisis un mot de passe différent de l'ancien.";
  if(/For security purposes|rate limit|too many/i.test(texte)) return "Trop de tentatives d'affilée. Patiente une minute avant de réessayer.";
  if(/Auth session missing|expired|invalid/i.test(texte)) return "Ce lien n'est plus valable. Redemandes-en un depuis « Mot de passe oublié ? ».";
  return texte;
}

// Zone d'échange. Le membre choisit une commune ; le site n'en retient que le
// point central, et n'en montre aux autres qu'un département et une distance
// approximative. C'est dit noir sur blanc dans le formulaire : on ne demande
// pas sa position à quelqu'un sans lui dire ce qui en sera fait.
let communesTrouvees = [];

function afficherZone(){
  const zone = document.getElementById('zone');
  if(!zone) return;
  const actuelle = zoneLisible(profil);

  zone.innerHTML = `
    <h2>Ma zone d'échange</h2>
    <p>Elle permet de ne voir que les collectionneurs proches de chez toi, et de convenir
       d'une remise en main propre plutôt que d'un envoi postal.
       Les autres membres ne voient que ton département et une distance approximative —
       jamais ta commune, et encore moins ton adresse.</p>

    <div class="zone-actuelle ${actuelle ? '' : 'vide'}">
      ${actuelle ? texteEchappe(actuelle) : 'Aucune zone renseignée : tu apparais dans les échanges sans indication de distance.'}
    </div>

    <label for="commune">Code postal ou nom de commune</label>
    <div class="recherche">
      <input id="commune" type="text" placeholder="69001, ou Lyon" autocomplete="postal-code">
      <button id="btn-commune">Chercher</button>
    </div>
    <div class="communes" id="communes"></div>
    <div class="zone-msg" id="zone-msg"></div>
    ${actuelle ? '<button class="discret" id="btn-retirer-zone">Retirer ma zone</button>' : ''}
  `;

  document.getElementById('btn-commune').addEventListener('click', chercherZone);
  document.getElementById('commune').addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); chercherZone(); }
  });
  document.getElementById('btn-retirer-zone')?.addEventListener('click', effacerZone);
}

function messageZone(texte, type){
  const el = document.getElementById('zone-msg');
  if(!el) return;
  el.className = `zone-msg ${type ?? ''}`;
  el.textContent = texte;
}

async function chercherZone(){
  const bouton = document.getElementById('btn-commune');
  const saisie = document.getElementById('commune').value;
  const liste = document.getElementById('communes');

  liste.innerHTML = '';
  messageZone('');
  if(saisie.trim().length < 2){
    messageZone('Indique un code postal ou au moins deux lettres.', 'err');
    return;
  }

  bouton.disabled = true;
  bouton.textContent = 'Recherche…';
  try{
    communesTrouvees = await chercherCommunes(saisie);
    if(communesTrouvees.length === 0){
      messageZone('Aucune commune ne correspond. Vérifie le code postal ou l\'orthographe.', 'err');
      return;
    }
    liste.innerHTML = communesTrouvees.map((c, i) => `
      <button class="commune" data-commune="${i}">
        ${texteEchappe(c.nom)}
        <small>${texteEchappe([c.codePostal, c.departement].filter(Boolean).join(' · '))}</small>
      </button>
    `).join('');
  }catch(err){
    console.warn('Recherche de commune impossible', err);
    messageZone("L'annuaire des communes est injoignable pour le moment. Réessaie dans un instant.", 'err');
  }finally{
    bouton.disabled = false;
    bouton.textContent = 'Chercher';
  }
}

async function effacerZone(){
  try{
    await retirerLocalisation();
    afficherZone();
    messageZone('Zone retirée.', 'ok');
  }catch(err){
    messageZone('Impossible de retirer la zone : ' + (err.message ?? err), 'err');
  }
}

document.addEventListener('click', async (e) => {
  const bouton = e.target.closest('[data-commune]');
  if(!bouton) return;
  const commune = communesTrouvees[Number(bouton.dataset.commune)];
  if(!commune) return;
  try{
    await definirLocalisation(commune);
    afficherZone();
    messageZone('Zone enregistrée. La jauge de distance est maintenant disponible dans les échanges.', 'ok');
  }catch(err){
    messageZone("L'enregistrement a échoué : " + (err.message ?? err), 'err');
  }
});

// Membres bloqués : la fenêtre de blocage annonce que c'est réversible, il
// faut donc que ça le soit réellement.
async function afficherBloques(){
  const zone = document.getElementById('bloques');
  if(!zone) return;
  try{
    const bloques = await listerBlocages();
    if(bloques.length === 0){ zone.innerHTML = ''; return; }
    zone.innerHTML = `
      <h2>Membres bloqués</h2>
      <p>Vous ne pouvez plus vous écrire, et vous n'apparaissez plus dans les échanges possibles l'un de l'autre.</p>
      ${bloques.map(b => `
        <div class="bloque">
          <span>${texteEchappe(b.pseudo)}</span>
          <button data-debloquer="${b.id}">Débloquer</button>
        </div>
      `).join('')}
    `;
  }catch(err){
    console.warn('Liste des blocages indisponible', err);
  }
}

document.addEventListener('click', async (e) => {
  const bouton = e.target.closest('[data-debloquer]');
  if(!bouton) return;
  bouton.disabled = true;
  try{
    await debloquerMembre(bouton.dataset.debloquer);
    await afficherBloques();
  }catch(err){
    bouton.disabled = false;
    afficherMessage('Le déblocage a échoué : ' + (err.message ?? err), 'err');
  }
});

async function demanderLien(){
  const bouton = document.getElementById('btn-lien');
  const email = document.getElementById('email').value.trim();
  if(!email){
    afficherMessage('Indique ton adresse e-mail.', 'err');
    return;
  }
  bouton.disabled = true;
  bouton.textContent = 'Envoi…';
  try{
    await envoyerLienReinitialisation(email);
    // On ne révèle pas si l'adresse correspond à un compte : ce serait dire à
    // un inconnu qui est inscrit ici.
    afficherMessage("Si un compte existe avec cette adresse, un lien vient d'y être envoyé. Pense à regarder tes courriers indésirables.", 'ok');
  }catch(err){
    afficherMessage(messageLisible(err), 'err');
  }finally{
    bouton.disabled = false;
    bouton.textContent = 'Envoyer le lien';
  }
}

async function enregistrerNouveauMotDePasse(){
  const bouton = document.getElementById('btn-nouveau-mdp');
  bouton.disabled = true;
  try{
    await definirNouveauMotDePasse(document.getElementById('mdp').value);
    afficherEtatCompte();
    rendre();
    afficherMessage('Mot de passe enregistré. Te voilà connecté.', 'ok');
  }catch(err){
    bouton.disabled = false;
    afficherMessage(messageLisible(err), 'err');
  }
}

async function terminerProfil(){
  const pseudo = document.getElementById('pseudo').value.trim();
  if(!pseudo){
    afficherMessage('Choisis un pseudo pour continuer.', 'err');
    return;
  }
  try{
    await creerProfil({
      pseudo,
      contact: document.getElementById('contact').value.trim() || null,
      ne_le: document.getElementById('naissance').value,
    });
    await fusionnerCollection();
    afficherEtatCompte();
    rendre();
    afficherMessage('Te voilà membre. Ta collection est enregistrée en ligne.', 'ok');
  }catch(err){
    afficherMessage(messageLisible(err), 'err');
  }
}

async function enregistrerProfil(){
  try{
    await majProfil(document.getElementById('pseudo').value, document.getElementById('contact').value, document.getElementById('naissance').value);
    afficherEtatCompte();
    rendre();
    afficherMessage('Profil enregistré.', 'ok');
  }catch(err){
    afficherMessage(messageLisible(err), 'err');

}

async function deconnexion(){
  await seDeconnecter();
  afficherEtatCompte();
  rendre();
}

(async () => {
  loadTags();
  await initCompte();
  afficherEtatCompte();
  rendre();
})();
